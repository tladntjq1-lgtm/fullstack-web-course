<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사칙연산 계산기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>사칙연산 계산기</h2>
        
        <div class="input-group">
            <!-- 첫 번째 숫자 입력 -->
            <input type="text" id="num1" placeholder="첫 번째 숫자입력">

            <!-- 연산자 선택 드롭다운 -->
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>s

            <!-- 두 번째 숫자 입력 -->
            <input type="text" id="num2" placeholder="두 번째 숫자입력">
        </div>

        <!-- 계산 버튼 -->
        <button id="calcBtn">계산하기</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
