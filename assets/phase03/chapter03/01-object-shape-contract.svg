<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Object Shape = Data Contract</text><rect x="80" y="150" width="430" height="420" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><text x="115" y="205" font-family="monospace" font-size="28" fill="#0f172a">const member = {</text><text x="145" y="260" font-family="monospace" font-size="27" fill="#334155">memberId: 1,</text><text x="145" y="315" font-family="monospace" font-size="27" fill="#334155">name: "Kim",</text><text x="145" y="370" font-family="monospace" font-size="27" fill="#334155">email: "kim@example.com",</text><text x="145" y="425" font-family="monospace" font-size="27" fill="#334155">age: 30</text><text x="115" y="480" font-family="monospace" font-size="28" fill="#0f172a">}</text><path d="M540 350 H665" stroke="#475569" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker></defs><rect x="690" y="150" width="430" height="420" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="3"/><text x="725" y="205" font-family="monospace" font-size="28" fill="#0f172a">interface Member {</text><text x="755" y="260" font-family="monospace" font-size="27" fill="#334155">memberId: number</text><text x="755" y="315" font-family="monospace" font-size="27" fill="#334155">name: string</text><text x="755" y="370" font-family="monospace" font-size="27" fill="#334155">email: string</text><text x="755" y="425" font-family="monospace" font-size="27" fill="#334155">age: number</text><text x="725" y="480" font-family="monospace" font-size="28" fill="#0f172a">}</text><text x="80" y="635" font-family="Arial,sans-serif" font-size="28" fill="#334155">값을 보고 추측하는 대신, 객체가 가져야 할 모양을 TypeScript로 계약한다.</text></svg>