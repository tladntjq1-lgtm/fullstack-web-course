<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Function Contract = Input → Output</text><rect x="85" y="205" width="250" height="190" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="125" y="270" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Input</text><text x="125" y="325" font-family="monospace" font-size="25" fill="#334155">Member[]</text><path d="M360 300 H500" stroke="#475569" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker></defs><rect x="520" y="175" width="280" height="250" rx="22" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="555" y="245" font-family="monospace" font-size="25" fill="#0f172a">function</text><text x="555" y="295" font-family="monospace" font-size="25" fill="#0f172a">findMember(</text><text x="555" y="345" font-family="monospace" font-size="23" fill="#334155">members, id</text><text x="555" y="395" font-family="monospace" font-size="25" fill="#0f172a">)</text><path d="M825 300 H950" stroke="#475569" stroke-width="5" marker-end="url(#b)"/><defs><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker></defs><rect x="965" y="205" width="165" height="190" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="995" y="270" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Output</text><text x="990" y="325" font-family="monospace" font-size="21" fill="#334155">Member</text><text x="990" y="360" font-family="monospace" font-size="21" fill="#334155">| undefined</text><text x="80" y="560" font-family="Arial,sans-serif" font-size="27" fill="#334155">함수 타입은 “무엇을 