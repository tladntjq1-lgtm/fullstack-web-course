<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700">Cache Strategy Map</text><g font-family="Arial" font-size="22" fill="#0f172a"><rect x="90" y="160" width="300" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="240" y="215" text-anchor="middle">Freshness 우선</text><text x="240" y="255" text-anchor="middle">매 요청 최신 데이터</text><rect x="450" y="160" width="300" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="215" text-anchor="middle">Reuse 우선</text><text x="600" y="255" text-anchor="middle">반복 요청 비용 감소</text><rect x="810" y="160" width="300" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="960" y="215" text-anchor="middle">Revalidate</text><text x="960" y="255" text-anchor="middle">일정 주기 새로고침</text><text x="120" y="390" font-weight="700">판단 질문</text><text x="120" y="435">1. 이 데이터는 얼마나 자주 변하는가?</text><text x="120" y="475">2. 오래된 값이 보여도 되는가?</text><text x="120" y="515">3. 조회 비용은 큰가?</text><text x="120" y="555">4. Mutation 후 언제 갱신해야 하는가?</text></g></svg>