<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#fff"/>
  <style>.t{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 21px Arial,sans-serif;fill:#111827}.b{font:18px Arial,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#9ca3af;stroke-width:2;rx:16}.a{stroke:#6b7280;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#6b7280"/></marker></defs>
  <text x="50" y="55" class="t">Mutation State Flow</text>
  <rect x="70" y="125" width="200" height="105" class="box"/><text x="110" y="165" class="h">Idle</text><text x="100" y="200" class="b">Form ready</text>
  <rect x="350" y="125" width="200" height="105" class="box"/><text x="395" y="165" class="h">Submitting</text><text x="380" y="200" class="b">button disabled</text>
  <rect x="630" y="80" width="220" height="105" class="box"/><text x="690" y="120" class="h">Success</text><text x="660" y="155" class="b">reconcile UI</text>
  <rect x="630" y="245" width="220" height="105" class="box"/><text x="705" y="285" class="h">Error</text><text x="670" y="320" class="b">show message</text>
  <line x1="270" y1="178" x2="350" y2="178" class="a"/><line x1="550" y1="165" x2="630" y2="135" class="a"/><line x1="550" y1="190" x2="630" y2="295" class="a"/>
  <text x="78" y="405" class="b">Mutation UI도 상태 모델입니다: idle → submitting → success/error</text>
</svg>