<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#ffffff"/>
  <style>
    .t{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 22px Arial,sans-serif;fill:#111827}.b{font:18px Arial,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#9ca3af;stroke-width:2;rx:16}.arrow{stroke:#6b7280;stroke-width:3;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
  <text x="50" y="55" class="t">React CRUD UI Flow</text>
  <rect x="60" y="120" width="210" height="120" class="box"/><text x="95" y="165" class="h">Create Form</text><text x="95" y="200" class="b">POST /members</text>
  <rect x="360" y="120" width="210" height="120" class="box"/><text x="400" y="165" class="h">Edit Form</text><text x="400" y="200" class="b">PUT / PATCH</text>
  <rect x="660" y="120" width="210" height="120" class="box"/><text x="705" y="165" class="h">Delete Action</text><text x="705" y="200" class="b">DELETE /members/{id}</text>
  <rect x="960" y="120" width="180" height="120" class="box"/><text x="1000" y="165" class="h">UI State</text><text x="990" y="200" class="b">Refresh / Reconcile</text>
  <line x1="270" y1="180" x2="360" y2="180" class="arrow"/><line x1="570" y1="180" x2="660" y2="180" class="arrow"/><line x1="870" y1="180" x2="960" y2="180" class="arrow"/>
  <rect x="210" y="330" width="780" height="120" class="box"/><text x="330" y="375" class="h">Every mutation needs Evidence</text><text x="315" y="414" class="b">Network Status + FastAPI Log + PostgreSQL Row + React UI</text>
</svg>