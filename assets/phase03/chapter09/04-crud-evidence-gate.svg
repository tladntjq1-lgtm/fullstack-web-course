<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#fff"/>
  <style>.t{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 21px Arial,sans-serif;fill:#111827}.b{font:18px Arial,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#9ca3af;stroke-width:2;rx:16}.a{stroke:#6b7280;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#6b7280"/></marker></defs>
  <text x="50" y="55" class="t">CRUD Evidence Gate</text>
  <rect x="70" y="130" width="185" height="95" class="box"/><text x="110" y="175" class="h">React UI</text><text x="95" y="205" class="b">form / list state</text>
  <rect x="330" y="130" width="185" height="95" class="box"/><text x="370" y="175" class="h">Network</text><text x="360" y="205" class="b">method/status/body</text>
  <rect x="590" y="130" width="185" height="95" class="box"/><text x="625" y="175" class="h">FastAPI</text><text x="620" y="205" class="b">log / response</text>
  <rect x="850" y="130" width="220" height="95" class="box"/><text x="900" y="175" class="h">PostgreSQL</text><text x="890" y="205" class="b">actual row state</text>
  <line x1="255" y1="177" x2="330" y2="177" class="a"/><line x1="515" y1="177" x2="590" y2="177" class="a"/><line x1="775" y1="177" x2="850" y2="177" class="a"/>
  <rect x="330" y="335" width="540" height="115" class="box"/><text x="460" y="380" class="h">All four agree?</text><text x="400" y="417" class="b">PASS → commit / FAIL → diagnose and re-test</text>
  <line x1="600" y1="225" x2="600" y2="335" class="a"/>
</svg>