<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Mutation Success → UI Refresh Strategy</text><rect x="90" y="150" width="300" height="130" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="145" y="205" font-size="25" font-family="Arial" font-weight="700">Mutation Success</text><text x="135" y="245" font-size="20" font-family="Arial">201 / 200 / 204</text><rect x="450" y="120" width="300" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="500" y="175" font-size="24" font-family="Arial" font-weight="700">Client strategy</text><text x="490" y="215" font-size="20" font-family="Arial">setState / refetch</text><rect x="450" y="340" width="300" height="150" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="500" y="395" font-size="24" font-family="Arial" font-weight="700">Server strategy</text><text x="486" y="435" font-size="20" font-family="Arial">revalidate / redirect</text><rect x="830" y="220" width="280" height="150" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="900" y="275" font-size="24" font-family="Arial" font-weight="700">Updated UI</text><text x="865" y="318" font-size="20" font-family="Arial">must match server truth</text><path d="M390 215 H450" stroke="#334155" stroke-width="5"/><path d="M390 215 C420 215 420 415 450 415" fill="none" stroke="#334155" stroke-width="5"/><path d="M750 195 C790 195 790 270 830 270" fill="none" stroke="#334155" stroke-width="5"/><path d="M750 415 C790 415 790 320 830 320" fill="none" stroke="#334155" stroke-width="5"/><text x="90" y="610" font-size="24" font-family="Arial" font-weight="700">Rule: mutation success is not complete until UI and server state agree.</text></svg>