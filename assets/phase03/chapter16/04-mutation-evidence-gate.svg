<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Mutation Evidence Gate</text><rect x="70" y="150" width="220" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="115" y="205" font-size="24" font-family="Arial" font-weight="700">Form / Action</text><text x="100" y="242" font-size="18" font-family="Arial">expected payload</text><rect x="340" y="150" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="386" y="205" font-size="24" font-family="Arial" font-weight="700">Request</text><text x="374" y="242" font-size="18" font-family="Arial">method + body</text><rect x="610" y="150" width="220" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="670" y="205" font-size="24" font-family="Arial" font-weight="700">FastAPI</text><text x="644" y="242" font-size="18" font-family="Arial">status + validation</text><rect x="880" y="150" width="220" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="940" y="205" font-size="24" font-family="Arial" font-weight="700">Database</text><text x="918" y="242" font-size="18" font-family="Arial">persisted row</text><rect x="260" y="400" width="680" height="150" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="390" y="455" font-size="27" font-family="Arial" font-weight="700">Updated UI / Revalidated View</text><text x="350" y="505" font-size="21" font-family="Arial">must reflect the same server truth after mutation</text><path d="M290 210 H340 M560 210 H610 M830 210 H880" stroke="#334155" stroke-width="5"/><path d="M990 270 C990 340 820 360 760 400" fill="none" stroke="#334155" stroke-width="5"/><text x="80" y="640" font-size="22" font-family="Arial" font-weight="700">Complete only when request, response, persistence, and UI agree.</text></svg>