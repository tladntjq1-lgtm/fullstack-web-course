<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Client fetch vs Server Action</text><rect x="70" y="140" width="460" height="430" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="110" y="195" font-size="28" font-family="Arial" font-weight="700">Client fetch</text><text x="110" y="250" font-size="22" font-family="Arial">Client Component</text><text x="110" y="300" font-size="22" font-family="Arial">→ event handler</text><text x="110" y="350" font-size="22" font-family="Arial">→ fetch()</text><text x="110" y="400" font-size="22" font-family="Arial">→ FastAPI</text><text x="110" y="450" font-size="22" font-family="Arial">→ response</text><text x="110" y="500" font-size="22" font-family="Arial">→ local UI state update</text><rect x="670" y="140" width="460" height="430" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="710" y="195" font-size="28" font-family="Arial" font-weight="700">Server Action</text><text x="710" y="250" font-size="22" font-family="Arial">Form / action</text><text x="710" y="300" font-size="22" font-family="Arial">→ server function</text><text x="710" y="350" font-size="22" font-family="Arial">→ FastAPI</text><text x="710" y="400" font-size="22" font-family="Arial">→ response</text><text x="710" y="450" font-size="22" font-family="Arial">→ revalidate / redirect</text><text x="710" y="500" font-size="22" font-family="Arial">→ server-rendered UI refresh</text><text x="60" y="650" font-size="25" font-family="Arial" font-weight="700">Choose by responsibility, not by fashion.</text></svg>