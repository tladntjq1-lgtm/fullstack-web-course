<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">FastAPI Mutation Boundary</text><rect x="80" y="160" width="250" height="140" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="128" y="220" font-size="26" font-family="Arial" font-weight="700">Next.js UI</text><text x="113" y="260" font-size="20" font-family="Arial">Form / Button / Event</text><rect x="475" y="160" width="250" height="140" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="522" y="220" font-size="26" font-family="Arial" font-weight="700">Mutation Layer</text><text x="510" y="260" font-size="20" font-family="Arial">Client fetch or Action</text><rect x="870" y="160" width="250" height="140" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="932" y="220" font-size="26" font-family="Arial" font-weight="700">FastAPI</text><text x="918" y="260" font-size="20" font-family="Arial">Business rules + DB</text><path d="M330 230 H475" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><path d="M725 230 H870" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect x="170" y="410" width="860" height="170" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="210" y="462" font-size="25" font-family="Arial" font-weight="700">FastAPI remains the source of mutation truth</text><text x="210" y="510" font-size="21" font-family="Arial">Validation · 404/409/422 · transaction · persistence</text><text x="210" y="548" font-size="21" font-family="Arial">Next.js decides how to submit and how to refresh the UI.</text></svg>