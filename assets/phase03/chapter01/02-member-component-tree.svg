<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Member Management Component Tree</text>
  <g font-family="Arial,sans-serif" fill="#0f172a">
    <rect x="450" y="120" width="300" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="175" text-anchor="middle" font-size="27" font-weight="700">MemberPage</text>

    <line x1="600" y1="210" x2="600" y2="270" stroke="#64748b" stroke-width="3"/>
    <line x1="180" y1="270" x2="1020" y2="270" stroke="#64748b" stroke-width="3"/>

    <line x1="180" y1="270" x2="180" y2="320" stroke="#64748b" stroke-width="3"/>
    <line x1="460" y1="270" x2="460" y2="320" stroke="#64748b" stroke-width="3"/>
    <line x1="740" y1="270" x2="740" y2="320" stroke="#64748b" stroke-width="3"/>
    <line x1="1020" y1="270" x2="1020" y2="320" stroke="#64748b" stroke-width="3"/>

    <rect x="60" y="320" width="240" height="110" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="180" y="365" text-anchor="middle" font-size="24" font-weight="700">MemberSearch</text>
    <text x="180" y="398" text-anchor="middle" font-size="17" fill="#7c2d12">검색어 입력 / 검색 이벤트</text>

    <rect x="340" y="320" width="240" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="460" y="365" text-anchor="middle" font-size="24" font-weight="700">MemberList</text>
    <text x="460" y="398" text-anchor="middle" font-size="17" fill="#166534">목록 / Empty 상태</text>

    <rect x="620" y="320" width="240" height="110" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="740" y="365" text-anchor="middle" font-size="24" font-weight="700">MemberDetail</text>
    <text x="740" y="398" text-anchor="middle" font-size="17" fill="#6b21a8">선택 회원 상세</text>

    <rect x="900" y="320" width="240" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1020" y="365" text-anchor="middle" font-size="24" font-weight="700">MemberForm</text>
    <text x="1020" y="398" text-anchor="middle" font-size="17" fill="#92400e">등록 / 수정 입력</text>

    <line x1="460" y1="430" x2="460" y2="500" stroke="#64748b" stroke-width="3"/>
    <rect x="350" y="500" width="220" height="100" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="460" y="542" text-anchor="middle" font-size="24" font-weight="700">MemberCard</text>
    <text x="460" y="575" text-anchor="middle" font-size="17" fill="#475569">한 명 표시 / 선택 이벤트</text>

    <rect x="180" y="650" width="840" height="60" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="688" text-anchor="middle" font-size="21" fill="#334155">Component는 화면 조각이 아니라 “하나의 명확한 책임”을 기준으로 나눕니다.</text>
