<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Props · State · Server Data</text>
  <g font-family="Arial,sans-serif">
    <rect x="80" y="150" width="300" height="260" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="230" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Props</text>
    <text x="110" y="255" font-size="20" fill="#1e40af">• 부모가 전달</text>
    <text x="110" y="295" font-size="20" fill="#1e40af">• 외부에서 들어오는 값</text>
    <text x="110" y="335" font-size="20" fill="#1e40af">• 읽기 중심의 입력 계약</text>
    <text x="110" y="375" font-size="20" fill="#1e40af">예: selectedMember</text>

    <rect x="450" y="150" width="300" height="260" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#14532d">State</text>
    <text x="480" y="255" font-size="20" fill="#166534">• Component가 기억</text>
    <text x="480" y="295" font-size="20" fill="#166534">• 사용자 행동으로 변경</text>
    <text x="480" y="335" font-size="20" fill="#166534">• UI 상호작용의 현재값</text>
    <text x="480" y="375" font-size="20" fill="#166534">예: searchKeyword</text>

    <rect x="820" y="150" width="300" height="260" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="970" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#78350f">Server Data</text>
    <text x="850" y="255" font-size="20" fill="#92400e">• API에서 가져옴</text>
    <text x="850" y="295" font-size="20" fill="#92400e">• Loading/Error 필요</text>
    <text x="850" y="335" font-size="20" fill="#92400e">• 원격 데이터와 동기화</text>
    <text x="850" y="375" font-size="20" fill="#92400e">예: members</text>

    <rect x="140" y="500" width="920" height="150" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="545" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">판단 질문</text>
    <text x="600" y="585" text-anchor="middle" font-size="20" fill="#334155">누가 이 값을 소유하는가? 어디에서 바뀌는가? API에서 다시 가져와야 하는가?</text>
    <text x="600" y="620" text-anchor="middle" font-size="20" fill="#334155">Hook 문법보다 데이터의 소유권을 먼저 판단합니다.</text>
  </g>
</svg>