<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Task → Evidence → Fix Loop</text><g font-family="Arial"><circle cx="220" cy="310" r="110" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="220" y="295" text-anchor="middle" font-size="27" font-weight="700">Task</text><text x="220" y="335" text-anchor="middle" font-size="20">small scope</text><circle cx="600" cy="310" r="110" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><text x="600" y="295" text-anchor="middle" font-size="27" font-weight="700">Implement</text><text x="600" y="335" text-anchor="middle" font-size="20">AI + developer</text><circle cx="980" cy="310" r="110" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="980" y="295" text-anchor="middle" font-size="27" font-weight="700">Evidence</text><text x="980" y="335" text-anchor="middle" font-size="20">UI/API/DB/Test</text><path d="M330 310 L490 310" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><path d="M710 310 L870 310" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><path d="M950 420 C900 585 325 585 250 420" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#r)"/><text x="600" y="565" text-anchor="middle" font-size="23" font-weight="700" fill="#b91c1c">Mismatch → 오류 원인 분석 → 수정 → 재검증</text><rect x="170" y="640" width="860" height="70" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="600" y="684" text-anchor="middle" font-size="22" font-weight="700">큰 기능을 한 번에 만들지 말고, Evidence가 확인 가능한 단위로 반복한다.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs></svg>