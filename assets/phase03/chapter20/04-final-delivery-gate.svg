am</text><text x="650" y="485" font-size="21">• Test / build result</text><text x="650" y="525" font-size="21">• Demo scenario</text><text x="650" y="565" font-size="21">• Known limitations</text><text x="600" y="675" text-anchor="middle" font-size="23" font-weight="700">완료 = 다른 사람이 저장소를 받아 같은 결과를 재현할 수 있음</text></g></svg>