<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">URL → Params → Data Request → UI</text><g font-family="Arial" fill="#111827"><rect x="70" y="230" width="210" height="110" rx="18" fill="#eef2ff" stroke="#111827" stroke-width="2"/><text x="175" y="275" text-anchor="middle" font-size="22" font-weight="700">URL</text><text x="175" y="310" text-anchor="middle" font-size="18">/members/42</text><rect x="340" y="230" width="210" height="110" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="445" y="275" text-anchor="middle" font-size="22" font-weight="700">params</text><text x="445" y="310" text-anchor="middle" font-size="18">memberId=42</text><rect x="610" y="230" width="230" height="110" rx="18" fill="#ecfeff" stroke="#111827" stroke-width="2"/><text x="725" y="275" text-anchor="middle" font-size="22" font-weight="700">FastAPI</text><text x="725" y="310" text-anchor="middle" font-size="18">GET /members/42</text><rect x="900" y="230" width="230" height="110" rx="18" fill="#f0fdf4" stroke="#111827" stroke-width="2"/><text x="1015" y="275" text-anchor="middle" font-size="22" font-weight="700">UI</text><text x="1015" y="310" text-anchor="middle" font-size="18">Member Detail</text></g><path d="M280 285 H330 M550 285 H600 M840 285 H890" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">URL 값은 곧 API 요청 조건이 되고, 응답 결과는 다시 화면이 된다.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs></svg>