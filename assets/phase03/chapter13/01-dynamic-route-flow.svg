<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Dynamic Route: URL 값을 Route Parameter로</text><rect x="100" y="220" width="250" height="120" rx="20" fill="#eef2ff" stroke="#111827" stroke-width="2"/><text x="225" y="270" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">/members/42</text><text x="225" y="305" text-anchor="middle" font-family="Arial" font-size="19">Browser URL</text><path d="M380 280 H500" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><rect x="520" y="190" width="300" height="180" rx="20" fill="#f9fafb" stroke="#111827" stroke-width="2"/><text x="670" y="245" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">app/members/[memberId]/</text><text x="670" y="285" text-anchor="middle" font-family="Arial" font-size="22">page.tsx</text><text x="670" y="330" text-anchor="middle" font-family="Arial" font-size="20">memberId = 42</text><path d="M850 280 H970" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><rect x="990" y="220" width="150" height="120" rx="20" fill="#ecfeff" stroke="#111827" stroke-width="2"/><text x="1065" y="270" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Detail</text><text x="1065" y="305" text-anchor="middle" font-family="Arial" font-size="18">Member 42</text><text x="600" y="540" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">고정 URL마다 파일을 만들지 않고, 바뀌는 구간을 [ ]로 표현한다.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs></svg>