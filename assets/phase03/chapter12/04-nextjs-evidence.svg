  <g font-family="Arial,sans-serif" fill="#111827">
    <rect x="100" y="170" width="230" height="120" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
    <text x="215" y="215" text-anchor="middle" font-size="24" font-weight="700">File Tree</text>
    <text x="215" y="255" text-anchor="middle" font-size="19">app/page/layout</text>
    <rect x="365" y="170" width="230" height="120" rx="18" fill="#eef2ff" stroke="#111827" stroke-width="2"/>
    <text x="480" y="215" text-anchor="middle" font-size="24" font-weight="700">Browser URL</text>
    <text x="480" y="255" text-anchor="middle" font-size="19">/members 확인</text>
    <rect x="630" y="170" width="230" height="120" rx="18" fill="#ecfeff" stroke="#111827" stroke-width="2"/>
    <text x="745" y="215" text-anchor="middle" font-size="24" font-weight="700">Type / Lint</text>
    <text x="745" y="255" text-anchor="middle" font-size="19">tsc / eslint</text>
    <rect x="895" y="170" width="230" height="120" rx="18" fill="#f0fdf4" stroke="#111827" stroke-width="2"/>
    <text x="1010" y="215" text-anchor="middle" font-size="24" font-weight="700">Build</text>
