  <path d="M215 330 V430 H1010 V330" fill="none" stroke="#111827" stroke-width="4"/>
  <rect x="360" y="430" width="480" height="100" rx="20" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="600" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Route 구조와 실행 결과가 일치하는가?</text>
  <text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">파일 → URL → UI → Build를 함께 확인</text>
  <text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">화면이 보이는 것만으로 완료하지 않는다.</text>
