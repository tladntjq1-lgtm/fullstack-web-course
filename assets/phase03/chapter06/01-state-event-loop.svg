<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#222}.t{font-size:30px;font-weight:700}.s{font-size:22px}.b{fill:#f4f7fb;stroke:#333;stroke-width:2;rx:18}</style><text x="60" y="60" class="t">React State &amp; Event Loop</text><rect x="60" y="130" width="210" height="110" class="b"/><text x="105" y="195" class="s">User Input</text><rect x="340" y="130" width="210" height="110" class="b"/><text x="400" y="195" class="s">Event</text><rect x="620" y="130" width="210" height="110" class="b"/><text x="665" y="180" class="s">setState()</text><text x="675" y="215" class="s">State Update</text><rect x="900" y="130" width="230" height="110" class="b"/><text x="940" y="180" class="s">Re-render</text><text x="950" y="215" class="s">Updated UI</text><path d="M270 185H340M550 185H620M830 185H900" stroke="#333" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs><text x="60" y="320" class="s">Core idea: Event changes State, and React renders the UI from that State.</text></svg>