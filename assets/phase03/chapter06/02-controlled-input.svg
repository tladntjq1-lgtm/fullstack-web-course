<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#222}.t{font-size:30px;font-weight:700}.s{font-size:21px}.b{fill:#f7f7f7;stroke:#333;stroke-width:2;rx:18}</style><text x="60" y="60" class="t">Controlled Input</text><rect x="70" y="130" width="250" height="120" class="b"/><text x="125" y="185" class="s">input value</text><text x="115" y="220" class="s">comes from State</text><rect x="470" y="130" width="250" height="120" class="b"/><text x="525" y="185" class="s">onChange</text><text x="515" y="220" class="s">updates State</text><rect x="870" y="130" width="250" height="120" class="b"/><text x="920" y="185" class="s">React State</text><text x="900" y="220" class="s">single source of truth</text><path d="M320 190H470M720 190H870" stroke="#333" stroke-width="3" marker-end="url(#a)"/><path d="M995 260 C995 340 195 340 195 260" fill="none" stroke="#666" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs><text x="60" y="385" class="s">Input UI and State stay synchronized through value + onChange.</text></svg>