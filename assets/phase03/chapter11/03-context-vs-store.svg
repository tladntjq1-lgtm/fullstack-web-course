<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Context vs External Store</text><rect x="90" y="140" width="450" height="330" rx="20" fill="#fafafa" stroke="#222"/><text x="245" y="190" font-size="30" font-family="Arial" font-weight="700">Context</text><text x="130" y="245" font-size="22" font-family="Arial">• 트리 여러 곳에서 필요한 값</text><text x="130" y="290" font-size="22" font-family="Arial">• Theme / Locale / Auth context 등</text><text x="130" y="335" font-size="22" font-family="Arial">• Provider 아래에서 공유</text><text x="130" y="380" font-size="22" font-family="Arial">• 단순한 공유에는 충분</text><rect x="660" y="140" width="450" height="330" rx="20" fill="#fafafa" stroke="#222"/><text x="755" y="190" font-size="30" font-family="Arial" font-weight="700">External Store</text><text x="700" y="245" font-size="22" font-family="Arial">• 앱 여러 영역에서 독립적으로 접근</text><text x="700" y="290" font-size="22" font-family="Arial">• 상태/액션이 복잡해짐</text><text x="700" y="335" font-size="22" font-family="Arial">• Provider 의존을 줄이고 싶을 때</text><text x="700" y="380" font-size="22" font-family="Arial">• 예: Zustand</text><text x="210" y="560" font-size="26" font-family="Arial" font-weight="700">기준: “전역으로 만들 수 있는가?”가 아니라 “전역이어야 하는가?”</text></svg>