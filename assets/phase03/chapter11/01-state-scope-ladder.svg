<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">State Scope Ladder</text><rect x="90" y="140" width="250" height="110" rx="18" fill="#f2f2f2" stroke="#222"/><text x="150" y="190" font-size="28" font-family="Arial">Local State</text><text x="115" y="225" font-size="20" font-family="Arial">한 Component에 가장 가까움</text><rect x="475" y="140" width="250" height="110" rx="18" fill="#f2f2f2" stroke="#222"/><text x="525" y="190" font-size="28" font-family="Arial">Lifted State</text><text x="505" y="225" font-size="20" font-family="Arial">형제들이 공유하는 최소 공통 부모</text><rect x="860" y="140" width="250" height="110" rx="18" fill="#f2f2f2" stroke="#222"/><text x="915" y="190" font-size="28" font-family="Arial">Context</text><text x="900" y="225" font-size="20" font-family="Arial">트리 여러 곳에서 공유</text><line x1="340" y1="195" x2="475" y2="195" stroke="#333" stroke-width="3"/><polygon points="475,195 455,185 455,205" fill="#333"/><line x1="725" y1="195" x2="860" y2="195" stroke="#333" stroke-width="3"/><polygon points="860,195 840,185 840,205" fill="#333"/><rect x="350" y="350" width="500" height="130" rx="18" fill="#fafafa" stroke="#222"/><text x="475" y="400" font-size="30" font-family="Arial" font-weight="700">External Store (예: Zustand)</text><text x="420" y="440" font-size="22" font-family="Arial">앱 전역에서 독립적으로 공유해야 할 상태</text><text x="210" y="575" font-size="26" font-family="Arial" font-weight="700">원칙: 필요한 범위보다 더 넓은 곳에 State를 두지 않는다.</text></svg>