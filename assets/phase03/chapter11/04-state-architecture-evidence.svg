<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">State Architecture Evidence</text><rect x="100" y="145" width="220" height="100" rx="16" fill="#f7f7f7" stroke="#222"/><text x="150" y="200" font-size="26" font-family="Arial">Type Check</text><rect x="370" y="145" width="220" height="100" rx="16" fill="#f7f7f7" stroke="#222"/><text x="420" y="200" font-size="26" font-family="Arial">Browser UI</text><rect x="640" y="145" width="220" height="100" rx="16" fill="#f7f7f7" stroke="#222"/><text x="675" y="200" font-size="26" font-family="Arial">Interaction</text><rect x="910" y="145" width="220" height="100" rx="16" fill="#f7f7f7" stroke="#222"/><text x="950" y="200" font-size="26" font-family="Arial">Regression</text><line x1="320" y1="195" x2="370" y2="195" stroke="#333" stroke-width="3"/><line x1="590" y1="195" x2="640" y2="195" stroke="#333" stroke-width="3"/><line x1="860" y1="195" x2="910" y2="195" stroke="#333" stroke-width="3"/><rect x="220" y="345" width="760" height="150" rx="20" fill="#fbfbfb" stroke="#222"/><text x="270" y="395" font-size="25" font-family="Arial">• 같은 State의 소유자가 하나인지 확인</text><text x="270" y="435" font-size="25" font-family="Arial">• 불필요한 중복 State / 복사본이 없는지 확인</text><text x="270" y="475" font-size="25" font-family="Arial">• Refactor 후 CRUD와 화면 동작이 그대로인지 확인</text><text x="265" y="575" font-size="26" font-family="Arial" font-weight="700">좋은 상태 구조 = 위치를 설명할 수 있고, 변경 영향 범위가 예측 가능하다.</text></svg>