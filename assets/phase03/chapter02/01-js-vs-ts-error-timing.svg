<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#ffffff"/><text x="600" y="70" text-anchor="middle" font-size="36" font-family="Arial" font-weight="700">JavaScript vs TypeScript — 오류 발견 시점</text><rect x="90" y="150" width="440" height="420" rx="24" fill="#f3f4f6" stroke="#111827" stroke-width="2"/><text x="310" y="205" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700">JavaScript</text><text x="310" y="275" text-anchor="middle" font-size="24" font-family="Arial">코드 작성</text><text x="310" y="330" text-anchor="middle" font-size="24" font-family="Arial">→ 실행</text><text x="310" y="385" text-anchor="middle" font-size="24" font-family="Arial">→ 사용자 동작</text><text x="310" y="440" text-anchor="middle" font-size="24" font-family="Arial">→ Runtime Error</text><text x="310" y="510" text-anchor="middle" font-size="22" font-family="Arial">오류를 늦게 발견할 수 있음</text><rect x="670" y="150" width="440" height="420" rx="24" fill="#eef6ff" stroke="#111827" stroke-width="2"/><text x="890" y="205" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700">TypeScript</text><text x="890" y="275" text-anchor="middle" font-size="24" font-family="Arial">코드 작성</text><text x="890" y="330" text-anchor="middle" font-size="24" font-family="Arial">→ Type Check</text><text x="890" y="385" text-anchor="middle" font-size="24" font-family="Arial">→ 오류 발견</text><text x="890" y="440" text-anchor="middle" font-size="24" font-family="Arial">→ 수정 후 실행</text><text x="890" y="510" text-anchor="middle" font-size="22" font-family="Arial">데이터 계약 오류를 더 일찍 발견</text><path d="M545 360 H655" stroke="#111827" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs></svg>