<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><text x="600" y="70" text-anchor="middle" font-size="36" font-family="Arial" font-weight="700">Type Check를 Evidence로 사용하기</text><rect x="90" y="170" width="250" height="120" rx="18" fill="#f8fafc" stroke="#222"/><text x="215" y="220" text-anchor="middle" font-size="26" font-family="Arial">AI 생성 코드</text><text x="215" y="258" text-anchor="middle" font-size="20" font-family="Arial">Member / status / array</text><rect x="475" y="170" width="250" height="120" rx="18" fill="#eef6ff" stroke="#222"/><text x="600" y="220" text-anchor="middle" font-size="26" font-family="Arial">Type Check</text><text x="600" y="258" text-anchor="middle" font-size="20" font-family="Arial">tsc --noEmit</text><rect x="860" y="170" width="250" height="120" rx="18" fill="#f8fafc" stroke="#222"/><text x="985" y="220" text-anchor="middle" font-size="26" font-family="Arial">결과 판단</text><text x="985" y="258" text-anchor="middle" font-size="20" font-family="Arial">0 errors / errors</text><path d="M350 230 H455" stroke="#222" stroke-width="4" marker-end="url(#a)"/><path d="M735 230 H840" stroke="#222" stroke-width="4" marker-end="url(#a)"/><rect x="250" y="410" width="700" height="140" rx="20" fill="#fafafa" stroke="#222"/><text x="600" y="458" text-anchor="middle" font-size="24" font-family="Arial">오류가 있으면 AI에게 정답 코드보다 먼저 묻는다</text><text x="600" y="500" text-anchor="middle" font-size="22" font-family="Arial">어떤 값의 계약이 어긋났는가? 어디부터 확인할 것인가?</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#222"/></marker></defs></svg>