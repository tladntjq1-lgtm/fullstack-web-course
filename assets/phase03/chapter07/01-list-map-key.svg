<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Member[] → map() → Component List</text><rect x="70" y="150" width="250" height="250" rx="20" fill="#f5f5f5" stroke="#222"/><text x="110" y="205" font-size="26" font-family="Arial">Member[]</text><text x="105" y="255" font-size="22" font-family="Arial">member_id: 1</text><text x="105" y="300" font-size="22" font-family="Arial">member_id: 2</text><text x="105" y="345" font-size="22" font-family="Arial">member_id: 3</text><text x="380" y="285" font-size="34" font-family="Arial">map()</text><line x1="330" y1="280" x2="500" y2="280" stroke="#222" stroke-width="4" marker-end="url(#a)"/><rect x="530" y="130" width="580" height="320" rx="20" fill="#fafafa" stroke="#222"/><text x="570" y="190" font-size="26" font-family="Arial">&lt;MemberCard key={member.member_id} ... /&gt;</text><text x="570" y="250" font-size="24" font-family="Arial">Card 1 — key 1</text><text x="570" y="300" font-size="24" font-family="Arial">Card 2 — key 2</text><text x="570" y="350" font-size="24" font-family="Arial">Card 3 — key 3</text><text x="70" y="540" font-size="24" font-family="Arial">Stable key = DB identifier. Avoid array index or random key for mutable lists.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs></svg>