<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">UI State Model</text><rect x="80" y="150" width="220" height="110" rx="18" fill="#f7f7f7" stroke="#222"/><text x="135" y="215" font-size="28" font-family="Arial">Loading</text><rect x="350" y="150" width="220" height="110" rx="18" fill="#f7f7f7" stroke="#222"/><text x="420" y="215" font-size="28" font-family="Arial">Error</text><rect x="620" y="150" width="220" height="110" rx="18" fill="#f7f7f7" stroke="#222"/><text x="690" y="215" font-size="28" font-family="Arial">Empty</text><rect x="890" y="150" width="220" height="110" rx="18" fill="#f7f7f7" stroke="#222"/><text x="940" y="215" font-size="28" font-family="Arial">Success</text><text x="90" y="355" font-size="25" font-family="Arial">loading === true</text><text x="360" y="355" font-size="25" font-family="Arial">error !== null</text><text x="630" y="355" font-size="25" font-family="Arial">members.length === 0</text><text x="900" y="355" font-size="25" font-family="Arial">members.length &gt; 0</text><text x="70" y="500" font-size="26" font-family="Arial">A blank screen is not a state. Every important state should explain itself to the user.</text></svg>