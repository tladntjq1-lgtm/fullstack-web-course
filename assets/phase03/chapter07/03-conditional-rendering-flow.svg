<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Conditional Rendering Decision Flow</text><text x="90" y="155" font-size="27" font-family="Arial">1. loading?</text><text x="90" y="225" font-size="27" font-family="Arial">2. error?</text><text x="90" y="295" font-size="27" font-family="Arial">3. members.length === 0?</text><text x="90" y="365" font-size="27" font-family="Arial">4. otherwise</text><rect x="570" y="120" width="470" height="70" rx="14" fill="#f8f8f8" stroke="#222"/><text x="625" y="165" font-size="24" font-family="Arial">"회원 목록을 불러오는 중입니다."</text><rect x="570" y="205" width="470" height="70" rx="14" fill="#f8f8f8" stroke="#222"/><text x="625" y="250" font-size="24" font-family="Arial">"회원 목록을 불러오지 못했습니다."</text><rect x="570" y="290" width="470" height="70" rx="14" fill="#f8f8f8" stroke="#222"/><text x="625" y="335" font-size="24" font-family="Arial">"등록된 회원이 없습니다."</text><rect x="570" y="375" width="470" height="70" rx="14" fill="#f8f8f8" stroke="#222"/><text x="625" y="420" font-size="24" font-family="Arial">Render MemberList</text><line x1="370" y1="155" x2="555" y2="155" stroke="#222" stroke-width="3"/><line x1="370" y1="225" x2="555" y2="225" stroke="#222" stroke-width="3"/><line x1="370" y1="295" x2="555" y2="295" stroke="#222" stroke-width="3"/><line x1="370" y1="365" x2="555" y2="410" stroke="#222" stroke-width="3"/><text x="70" y="545" font-size="24" font-family="Arial">Prefer readable branches over deeply nested ternaries when UI states become complex.</text></svg>