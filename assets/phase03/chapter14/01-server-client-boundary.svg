<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.t{font-family:Arial,sans-serif;fill:#111}.h{font-size:34px;font-weight:700}.m{font-size:24px}.b{fill:#fff;stroke:#111;stroke-width:2;rx:16}.a{stroke:#111;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="60" y="70" class="t h">Next.js Server / Client Component Boundary</text><rect x="80" y="140" width="420" height="420" class="b"/><text x="120" y="190" class="t h">Server Component</text><text x="120" y="245" class="t m">• default in App Router</text><text x="120" y="290" class="t m">• data fetching</text><text x="120" y="335" class="t m">• secret/server-only logic</text><text x="120" y="380" class="t m">• no useState / onClick</text><rect x="700" y="140" width="420" height="420" class="b"/><text x="740" y="190" class="t h">Client Component</text><text x="740" y="245" class="t m">• "use client"</text><text x="740" y="290" class="t m">• state / event</text><text x="740" y="335" class="t m">• browser APIs</text><text x="740" y="380" class="t m">• interactive UI</text><line x1="500" y1="350" x2="690" y2="350" class="a"/><text x="520" y="320" class="t m">props</text></svg>