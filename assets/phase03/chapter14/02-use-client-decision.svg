<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.t{font-family:Arial,sans-serif;fill:#111}.h{font-size:34px;font-weight:700}.m{font-size:24px}.b{fill:#fff;stroke:#111;stroke-width:2;rx:16}.a{stroke:#111;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="60" y="70" class="t h">When do we need "use client"?</text><rect x="80" y="140" width="260" height="100" class="b"/><text x="115" y="200" class="t m">Need useState?</text><rect x="80" y="290" width="260" height="100" class="b"/><text x="115" y="350" class="t m">Need onClick?</text><rect x="80" y="440" width="260" height="100" class="b"/><text x="115" y="500" class="t m">Need window?</text><rect x="760" y="220" width="320" height="180" class="b"/><text x="815" y="285" class="t h">Yes</text><text x="815" y="340" class="t m">Client boundary</text><rect x="760" y="470" width="320" height="120" class="b"/><text x="790" y="540" class="t m">Otherwise keep Server</text><line x1="340" y1="190" x2="750" y2="280" class="a"/><line x1="340" y1="340" x2="750" y2="310" class="a"/><line x1="340" y1="490" x2="750" y2="345" class="a"/></svg>