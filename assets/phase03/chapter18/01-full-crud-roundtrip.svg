<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:Arial,sans-serif;fill:#111} .t{font-size:30px;font-weight:bold}.s{font-size:22px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="50" y="60" class="t">Full CRUD Round Trip</text><rect x="60" y="150" width="210" height="110" rx="18" class="b"/><text x="100" y="215" class="s">Next.js UI</text><rect x="360" y="150" width="230" height="110" rx="18" class="b"/><text x="390" y="205" class="s">Typed API Client</text><rect x="690" y="150" width="190" height="110" rx="18" class="b"/><text x="745" y="215" class="s">FastAPI</text><rect x="970" y="150" width="170" height="110" rx="18" class="b"/><text x="995" y="215" class="s">PostgreSQL</text><line x1="270" y1="205" x2="360" y2="205" class="a"/><line x1="590" y1="205" x2="690" y2="205" class="a"/><line x1="880" y1="205" x2="970" y2="205" class="a"/><text x="90" y="360" class="s">GET 목록 / 상세</text><text x="90" y="410" class="s">POST 등록</text><text x="90" y="460" class="s">PUT/PATCH 수정</text><text x="90" y="510" class="s">DELETE 삭제</text><text x="690" y="360" class="s">Response / Status</text><text x="690" y="410" class="s">→ State / Route 갱신</text><text x="690" y="460" class="s">→ 재조회 또는 local sync</text><text x="690" y="510" class="s">→ UI가 DB 상태와 일치</text></svg>