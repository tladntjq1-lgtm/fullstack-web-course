<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:bold}.s{font-size:22px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="50" y="60" class="t">Member CRUD Screen Flow</text><rect x="70" y="150" width="220" height="110" rx="18" class="b"/><text x="125" y="215" class="s">목록</text><rect x="365" y="150" width="220" height="110" rx="18" class="b"/><text x="420" y="215" class="s">상세</text><rect x="660" y="80" width="220" height="110" rx="18" class="b"/><text x="715" y="145" class="s">등록</text><rect x="660" y="250" width="220" height="110" rx="18" class="b"/><text x="715" y="315" class="s">수정</text><rect x="960" y="150" width="180" height="110" rx="18" class="b"/><text x="1010" y="215" class="s">삭제</text><line x1="290" y1="205" x2="365" y2="205" class="a"/><line x1="585" y1="185" x2="660" y2="140" class="a"/><line x1="585" y1="225" x2="660" y2="300" class="a"/><line x1="880" y1="305" x2="960" y2="220" class="a"/><text x="90" y="450" class="s">URL 예: /members → /members/42</text><text x="90" y="500" class="s">등록 성공 → 목록/상세 재검증</text><text x="90" y="550" class="s">수정 성공 → 상세/목록 동기화</text><text x="90" y="600" class="s">삭제 성공 → 상세 제거 + 목록 반영</text></svg>