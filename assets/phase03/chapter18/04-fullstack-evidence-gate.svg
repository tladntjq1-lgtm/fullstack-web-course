<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:bold}.s{font-size:21px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="50" y="60" class="t">Full-stack CRUD Evidence Gate</text><rect x="70" y="130" width="220" height="100" rx="18" class="b"/><text x="120" y="190" class="s">Browser UI</text><rect x="360" y="130" width="220" height="100" rx="18" class="b"/><text x="395" y="190" class="s">Network / Route</text><rect x="650" y="130" width="220" height="100" rx="18" class="b"/><text x="705" y="190" class="s">FastAPI</text><rect x="940" y="130" width="200" height="100" rx="18" class="b"/><text x="980" y="190" class="s">PostgreSQL</text><line x1="290" y1="180" x2="360" y2="180" class="a"/><line x1="580" y1="180" x2="650" y2="180" class="a"/><line x1="870" y1="180" x2="940" y2="180" class="a"/><text x="85" y="330" class="s">1. GET 목록/상세</text><text x="85" y="375" class="s">2. POST 등록 → 201</text><text x="85" y="420" class="s">3. PUT/PATCH 수정 → 200</text><text x="85" y="465" class="s">4. DELETE → 204</text><text x="85" y="510" class="s">5. 404 / 409 / 422 오류 재현</text><text x="620" y="350" class="s">완료 판단:</text><text x="620" y="395" class="s">UI 값 = API Response = DB Row</text><text x="620" y="440" class="s">상태 코드가 Contract와 일치</text><text x="620" y="485" class="s">Type Check / Build 통과</text><text x="620" y="530" class="s">Regression: 기존 CRUD가 모두 유지</text></svg>