<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:30px;font-weight:bold}.s{font-size:21px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="50" y="60" class="t">Mutation 후 UI 동기화 전략</text><rect x="80" y="160" width="240" height="100" rx="18" class="b"/><text x="125" y="220" class="s">Mutation 성공</text><rect x="430" y="90" width="300" height="130" rx="18" class="b"/><text x="490" y="145" class="s">재조회 / refresh</text><text x="465" y="185" class="s">Server를 다시 Source of Truth로 확인</text><rect x="430" y="300" width="300" height="130" rx="18" class="b"/><text x="500" y="355" class="s">Local State 동기화</text><text x="485" y="395" class="s">성공 Response로 즉시 반영</text><rect x="850" y="190" width="260" height="130" rx="18" class="b"/><text x="915" y="245" class="s">UI 일치</text><text x="890" y="285" class="s">목록/상세/폼 상태 검증</text><line x1="320" y1="205" x2="430" y2="150" class="a"/><line x1="320" y1="215" x2="430" y2="360" class="a"/><line x1="730" y1="155" x2="850" y2="230" class="a"/><line x1="730" y1="365" x2="850" y2="280" class="a"/><text x="80" y="530" class="s">초보 기본값: 성공 후 재조회/refresh → 단순하고 검증하기 쉬움</text><text x="80" y="580" class="s">Local sync: 빠르지만 목록/상세/선택 상태를 모두 일치시키는 책임이 생김</text></svg>