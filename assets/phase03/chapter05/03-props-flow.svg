<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:20px}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="60" y="70" class="t">Props Data Flow</text><rect x="90" y="190" width="300" height="180" rx="18" class="box"/><text x="175" y="240" class="h">MemberPage</text><text x="135" y="300" class="b">members: Member[]</text><text x="135" y="340" class="b">selectedMember</text><line x1="410" y1="280" x2="730" y2="280" class="arrow"/><text x="505" y="250" class="b">member={member}</text><rect x="760" y="190" width="330" height="180" rx="18" class="box"/><text x="850" y="240" class="h">MemberCard</text><text x="805" y="300" class="b">Props로 Member 수신</text><text x="805" y="340" class="b">화면 표시 책임</text><text x="90" y="465" class="h">핵심</text><text x="90" y="510" class="b">Props는 부모가 소유한 데이터를 자식에게 전달하는 통로다.</text><text x="90" y="555" class="b">자식은 받은 값을 임의로 자기 소유 State처럼 다루지 않는다.</text></svg>