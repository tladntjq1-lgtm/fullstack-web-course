<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:20px}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="60" y="70" class="t">JSX / TSX Anatomy</text><rect x="70" y="145" width="460" height="380" rx="18" class="box"/><text x="110" y="195" class="h">MemberCard.tsx</text><text x="110" y="250" class="b">function MemberCard(props) {</text><text x="145" y="295" class="b">return (</text><text x="180" y="340" class="b">&lt;article&gt;</text><text x="215" y="385" class="b">&lt;h3&gt;{props.member.name}&lt;/h3&gt;</text><text x="215" y="430" class="b">&lt;p&gt;{props.member.email}&lt;/p&gt;</text><text x="180" y="475" class="b">&lt;/article&gt;</text><text x="145" y="510" class="b">)</text><text x="110" y="545" class="b">}</text><line x1="560" y1="260" x2="810" y2="260" class="arrow"/><line x1="560" y1="365" x2="810" y2="365" class="arrow"/><line x1="560" y1="470" x2="810" y2="470" class="arrow"/><rect x="840" y="210" width="290" height="100" rx="16" class="box"/><text x="885" y="270" class="b">JavaScript 표현식</text><rect x="840" y="320" width="290" height="100" rx="16" class="box"/><text x="905" y="380" class="b">UI Markup</text><rect x="840" y="430" width="290" height="100" rx="16" class="box"/><text x="875" y="490" class="b">TypeScript + JSX</text><text x="70" y="625" class="b">TSX는 HTML 문자열이 아니라 JavaScript 안에서 UI 구조와 타입을 함께 표현한다.</text></svg>