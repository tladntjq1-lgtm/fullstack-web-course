<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:20px}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="60" y="70" class="t">React Component Evidence</text><rect x="70" y="180" width="230" height="120" rx="16" class="box"/><text x="115" y="235" class="h">Type Check</text><text x="110" y="275" class="b">tsc --noEmit</text><line x1="320" y1="240" x2="465" y2="240" class="arrow"/><rect x="490" y="180" width="230" height="120" rx="16" class="box"/><text x="555" y="235" class="h">Browser</text><text x="535" y="275" class="b">화면 구조 확인</text><line x1="740" y1="240" x2="885" y2="240" class="arrow"/><rect x="910" y="180" width="230" height="120" rx="16" class="box"/><text x="955" y="235" class="h">DevTools</text><text x="945" y="275" class="b">Console Error 확인</text><text x="70" y="400" class="h">완료 판단</text><text x="70" y="450" class="b">Component Tree와 실제 화면 구조가 일치한다.</text><text x="70" y="495" class="b">Props 타입 오류가 없다.</text><text x="70" y="540" class="b">Browser Console에 예상하지 못한 오류가 없다.</text><text x="70" y="585" class="b">아직 State/API가 없어도 구조 구현 자체를 Evidence로 검증한다.</text></svg>