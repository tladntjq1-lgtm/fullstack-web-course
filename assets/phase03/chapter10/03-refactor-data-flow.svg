<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.t{font:700 34px sans-serif}.h{font:700 23px sans-serif}.b{font:19px sans-serif}.box{fill:#fff;stroke:#222;stroke-width:2}.arrow{stroke:#222;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">리팩터링 후 데이터 흐름</text><rect x="70" y="290" width="220" height="110" rx="18" class="box"/><text x="115" y="340" class="h">MemberPage</text><text x="110" y="375" class="b">조립 / 전달</text><line x1="300" y1="345" x2="430" y2="345" class="arrow"/><rect x="450" y="170" width="260" height="120" rx="18" class="box"/><text x="505" y="225" class="h">MemberForm</text><text x="505" y="260" class="b">입력 / submit</text><rect x="450" y="400" width="260" height="120" rx="18" class="box"/><text x="505" y="455" class="h">MemberList</text><text x="505" y="490" class="b">목록 / 선택</text><line x1="720" y1="230" x2="860" y2="300" class="arrow"/><line x1="720" y1="460" x2="860" y2="390" class="arrow"/><rect x="880" y="250" width="250" height="220" rx="18" class="box"/><text x="940" y="305" class="h">useMembers</text><text x="930" y="350" class="b">State</text><text x="930" y="385" class="b">Effect</text><text x="930" y="420" class="b">CRUD 함수</text><text x="420" y="620" class="b">UI는 의도를 표현하고, Hook은 데이터 흐름을 캡슐화한다.</text></svg>