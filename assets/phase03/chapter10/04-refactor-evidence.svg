<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.t{font:700 34px sans-serif}.h{font:700 23px sans-serif}.b{font:19px sans-serif}.box{fill:#fff;stroke:#222;stroke-width:2}.arrow{stroke:#222;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">리팩터링 완료 Evidence</text><rect x="80" y="160" width="240" height="120" rx="18" class="box"/><text x="125" y="215" class="h">Type Check</text><text x="115" y="250" class="b">tsc --noEmit PASS</text><line x1="330" y1="220" x2="440" y2="220" class="arrow"/><rect x="460" y="160" width="240" height="120" rx="18" class="box"/><text x="515" y="215" class="h">UI Regression</text><text x="500" y="250" class="b">기존 화면 동일</text><line x1="710" y1="220" x2="820" y2="220" class="arrow"/><rect x="840" y="160" width="270" height="120" rx="18" class="box"/><text x="885" y="215" class="h">Network/API</text><text x="875" y="250" class="b">기존 요청 계약 동일</text><rect x="250" y="390" width="300" height="140" rx="18" class="box"/><text x="315" y="445" class="h">Responsibility</text><text x="300" y="485" class="b">Component / Hook 경계 설명</text><rect x="650" y="390" width="300" height="140" rx="18" class="box"/><text x="735" y="445" class="h">Behavior</text><text x="705" y="485" class="b">CRUD 기능 Regression 없음</text><text x="285" y="620" class="b">리팩터링은 새 기능 추가가 아니라, 기존 동작을 유지하며 구조를 개선하는 작업이다.</text></svg>