<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font:700 34px Arial,sans-serif;fill:#111}.b{font:600 23px Arial,sans-serif;fill:#222}.s{font:500 19px Arial,sans-serif;fill:#444}.box{fill:#f8f8f8;stroke:#222;stroke-width:3;rx:18}.arr{stroke:#222;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">Frontend API Evidence Chain</text><rect x="60" y="150" width="230" height="110" class="box"/><text x="100" y="190" class="b">Browser UI</text><text x="95" y="225" class="s">Member List</text><rect x="350" y="150" width="230" height="110" class="box"/><text x="390" y="190" class="b">Network</text><text x="390" y="225" class="s">GET /members 200</text><rect x="640" y="150" width="230" height="110" class="box"/><text x="685" y="190" class="b">FastAPI Log</text><text x="690" y="225" class="s">Request / Response</text><rect x="930" y="150" width="210" height="110" class="box"/><text x="965" y="190" class="b">PostgreSQL</text><text x="965" y="225" class="s">Actual Rows</text><line x1="290" y1="205" x2="350" y2="205" class="arr"/><line x1="580" y1="205" x2="640" y2="205" class="arr"/><line x1="870" y1="205" x2="930" y2="205" class="arr"/><rect x="220" y="390" width="760" height="130" class="box"/><text x="285" y="435" class="b">정상 판정</text><text x="285" y="475" class="s">Network Response JSON = FastAPI Response = PostgreSQL Row = 화면 데이터</text><text x="60" y="610" class="s">화면만 보고 성공이라고 판단하지 않고 Network, Backend, DB를 함께 비교한다.</text></svg>