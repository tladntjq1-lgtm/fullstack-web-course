<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font:700 34px Arial,sans-serif;fill:#111}.b{font:600 23px Arial,sans-serif;fill:#222}.s{font:500 19px Arial,sans-serif;fill:#444}.box{fill:#f8f8f8;stroke:#222;stroke-width:3;rx:18}.arr{stroke:#222;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">API 결과를 UI State로 바꾸기</text><rect x="80" y="140" width="240" height="110" class="box"/><text x="125" y="190" class="b">loading = true</text><rect x="430" y="140" width="240" height="110" class="box"/><text x="500" y="190" class="b">fetch()</text><rect x="780" y="140" width="300" height="110" class="box"/><text x="840" y="185" class="b">Response OK?</text><line x1="320" y1="195" x2="430" y2="195" class="arr"/><line x1="670" y1="195" x2="780" y2="195" class="arr"/><rect x="150" y="370" width="260" height="120" class="box"/><text x="205" y="415" class="b">Success</text><text x="190" y="450" class="s">members = data</text><rect x="470" y="370" width="260" height="120" class="box"/><text x="545" y="415" class="b">Empty</text><text x="505" y="450" class="s">members.length = 0</text><rect x="790" y="370" width="260" height="120" class="box"/><text x="865" y="415" class="b">Error</text><text x="835" y="450" class="s">error = message</text><line x1="900" y1="250" x2="300" y2="370" class="arr"/><line x1="930" y1="250" x2="600" y2="370" class="arr"/><line x1="960" y1="250" x2="920" y2="370" class="arr"/><text x="80" y="600" class="s">finally에서 loading=false로 바꾸고, Chapter 07의 Loading / Error / Empty / Success UI로 연결한다.</text></svg>