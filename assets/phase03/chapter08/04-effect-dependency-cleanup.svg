<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font:700 34px Arial,sans-serif;fill:#111}.b{font:600 23px Arial,sans-serif;fill:#222}.s{font:500 19px Arial,sans-serif;fill:#444}.box{fill:#f8f8f8;stroke:#222;stroke-width:3;rx:18}.arr{stroke:#222;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">Effect Dependency와 Cleanup</text><rect x="80" y="150" width="250" height="120" class="box"/><text x="125" y="195" class="b">Dependency []</text><text x="110" y="230" class="s">mount 시 시작</text><rect x="470" y="150" width="250" height="120" class="box"/><text x="530" y="195" class="b">fetch 시작</text><text x="505" y="230" class="s">외부 시스템 동기화</text><rect x="860" y="150" width="250" height="120" class="box"/><text x="925" y="195" class="b">Response</text><text x="900" y="230" class="s">State 갱신</text><line x1="330" y1="210" x2="470" y2="210" class="arr"/><line x1="720" y1="210" x2="860" y2="210" class="arr"/><rect x="250" y="390" width="300" height="120" class="box"/><text x="315" y="435" class="b">Cleanup</text><text x="290" y="470" class="s">ignore / abort / unsubscribe</text><rect x="650" y="390" width="300" height="120" class="box"/><text x="705" y="435" class="b">Why?</text><text x="695" y="470" class="s">stale response / race 방지</text><line x1="550" y1="450" x2="650" y2="450" class="arr"/><text x="80" y="610" class="s">Effect가 읽는 reactive value는 dependency에 포함해야 하며, fetch는 필요하면 cleanup으로 오래된 응답 반영을 막는다.</text></svg>