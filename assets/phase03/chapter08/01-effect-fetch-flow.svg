<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font:700 34px Arial,sans-serif;fill:#111}.b{font:600 24px Arial,sans-serif;fill:#222}.s{font:500 20px Arial,sans-serif;fill:#444}.box{fill:#f7f7f7;stroke:#222;stroke-width:3;rx:18}.arr{stroke:#222;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">useEffect → fetch → State → UI</text><rect x="70" y="150" width="210" height="110" class="box"/><text x="110" y="205" class="b">Component Mount</text><rect x="360" y="150" width="180" height="110" class="box"/><text x="405" y="205" class="b">useEffect</text><rect x="620" y="150" width="180" height="110" class="box"/><text x="680" y="205" class="b">fetch()</text><rect x="880" y="150" width="230" height="110" class="box"/><text x="930" y="190" class="b">FastAPI</text><text x="930" y="225" class="s">GET /members</text><line x1="280" y1="205" x2="360" y2="205" class="arr"/><line x1="540" y1="205" x2="620" y2="205" class="arr"/><line x1="800" y1="205" x2="880" y2="205" class="arr"/><rect x="880" y="360" width="230" height="110" class="box"/><text x="930" y="405" class="b">JSON Response</text><rect x="620" y="360" width="180" height="110" class="box"/><text x="655" y="405" class="b">setMembers</text><rect x="360" y="360" width="180" height="110" class="box"/><text x="400" y="405" class="b">State Update</text><rect x="70" y="360" width="210" height="110" class="box"/><text x="110" y="405" class="b">Re-render UI</text><line x1="880" y1="415" x2="800" y2="415" class="arr"/><line x1="620" y1="415" x2="540" y2="415" class="arr"/><line x1="360" y1="415" x2="280" y2="415" class="arr"/><text x="70" y="585" class="s">외부 시스템(Network)과 동기화할 때 Effect를 사용하고, 결과를 State에 저장해 UI를 갱신한다.</text></svg>