<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Authentication &amp; Trust Boundary</text><rect x="70" y="150" width="230" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="185" y="195" text-anchor="middle" font-size="26" font-family="Arial">Browser</text><text x="185" y="230" text-anchor="middle" font-size="20" font-family="Arial">Untrusted Input</text><rect x="485" y="150" width="230" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="600" y="195" text-anchor="middle" font-size="26" font-family="Arial">FastAPI</text><text x="600" y="230" text-anchor="middle" font-size="20" font-family="Arial">Auth + Validation</text><rect x="900" y="150" width="230" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1015" y="195" text-anchor="middle" font-size="26" font-family="Arial">PostgreSQL</text><text x="1015" y="230" text-anchor="middle" font-size="20" font-family="Arial">Protected Data</text><line x1="300" y1="210" x2="485" y2="210" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><line x1="715" y1="210" x2="900" y2="210" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="390" y="185" text-anchor="middle" font-size="18" font-family="Arial">token / cookie / input</text><text x="808" y="185" text-anchor="middle" font-size="18" font-family="Arial">authorized query</text><rect x="170" y="390" width="860" height="190" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="600" y="435" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700">Trust Rule</text><text x="600" y="480" text-anchor="middle" font-size="23" font-family="Arial">Browser에서 전달되는 값은 신뢰하지 않는다.</text><text x="600" y="520" text-anchor="middle" font-size="23" font-family="Arial">인증(Authentication) 후에도 권한(Authorization)과 입력 검증은 별도다.</text><text x="600" y="560" text-anchor="middle" font-size="23" font-family="Arial">Secret은 Browser로 전달되면 더 이상 Secret이 아니다.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs></svg>