<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Secret &amp; Environment Variable Boundary</text><rect x="80" y="150" width="290" height="150" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="225" y="195" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700">Server-only</text><text x="225" y="235" text-anchor="middle" font-size="21" font-family="Arial">DB_PASSWORD</text><text x="225" y="270" text-anchor="middle" font-size="21" font-family="Arial">AUTH_SECRET</text><rect x="455" y="150" width="290" height="150" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="600" y="195" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700">Public Config</text><text x="600" y="235" text-anchor="middle" font-size="21" font-family="Arial">NEXT_PUBLIC_API_BASE_URL</text><text x="600" y="270" text-anchor="middle" font-size="21" font-family="Arial">Browser can read</text><rect x="830" y="150" width="290" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="975" y="195" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700">Deployment</text><text x="975" y="235" text-anchor="middle" font-size="21" font-family="Arial">Platform Environment</text><text x="975" y="270" text-anchor="middle" font-size="21" font-family="Arial">No secret in Git</text><path d="M370 225 L455 225" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><path d="M745 225 L830 225" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="400" width="900" height="170" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="600" y="445" text-anchor="middle" font-size="27" font-family="Arial" font-weight="700">Rule</text><text x="600" y="490" text-anchor="middle" font-size="23" font-family="Arial">Browser로 전달되는 환경변수는 공개 정보로 취급한다.</text><text x="600" y="530" text-anchor="middle" font-size="23" font-family="Arial">Secret은 저장소가 아니라 실행 환경에 주입한다.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs></svg>