<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Pre-deploy Quality Gate</text><g font-family="Arial"><rect x="70" y="170" width="220" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="180" y="215" text-anchor="middle" font-size="25" font-weight="700">Type Check</text><text x="180" y="255" text-anchor="middle" font-size="20">tsc --noEmit</text><rect x="350" y="170" width="220" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="460" y="215" text-anchor="middle" font-size="25" font-weight="700">Lint / Build</text><text x="460" y="255" text-anchor="middle" font-size="20">npm run build</text><rect x="630" y="170" width="220" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="740" y="215" text-anchor="middle" font-size="25" font-weight="700">API Test</text><text x="740" y="255" text-anchor="middle" font-size="20">pytest / TestClient</text><rect x="910" y="170" width="220" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1020" y="215" text-anchor="middle" font-size="25" font-weight="700">Smoke Test</text><text x="1020" y="255" text-anchor="middle" font-size="20">UI + Network + DB</text><line x1="290" y1="230" x2="350" y2="230" stroke="#334155" stroke-width="4"/><line x1="570" y1="230" x2="630" y2="230" stroke="#334155" stroke-width="4"/><line x1="850" y1="230" x2="910" y2="230" stroke="#334155" stroke-width="4"/><rect x="180" y="410" width="840" height="160" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="600" y="455" text-anchor="middle" font-size="27" font-weight="700">Deployment Rule</text><text x="600" y="500" text-anchor="middle" font-size="23">각 Gate가 통과하기 전에는 배포 완료로 보지 않는다.</text><text x="600" y="540" text-anchor="middle" font-size="23">실패 로그 자체가 수정의 Evidence다.</text></g></s