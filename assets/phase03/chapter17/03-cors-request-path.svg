<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">CORS depends on the request path</text><rect x="70" y="150" width="300" height="150" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="115" y="205" font-size="25" font-family="Arial" font-weight="700">Browser Client fetch</text><text x="105" y="250" font-size="21" font-family="Arial">localhost:3000 → 8000</text><text x="110" y="285" font-size="20" font-family="Arial">CORS applies</text><rect x="450" y="150" width="300" height="150" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="495" y="205" font-size="25" font-family="Arial" font-weight="700">Next.js Server</text><text x="490" y="250" font-size="21" font-family="Arial">server → FastAPI</text><text x="495" y="285" font-size="20" font-family="Arial">Browser CORS does not</text><rect x="830" y="150" width="300" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="895" y="205" font-size="25" font-family="Arial" font-weight="700">FastAPI</text><text x="880" y="250" font-size="21" font-family="Arial">API contract unchanged</text><path d="M370 225 H830" stroke="#334155" stroke-width="5"/><path d="M750 225 H830" stroke="#334155" stroke-width="5"/><text x="120" y="450" font-size="24" font-family="Arial" font-weight="700">Origin = scheme + host + port</text><text x="120" y="500" font-size="22" font-family="Arial">CORS is a browser security policy, not a FastAPI-only concept.</text></svg>