<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">Typed API Integration Evidence</text><rect x="70" y="150" width="210" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="105" y="215" font-size="22" font-family="Arial" font-weight="700">Type Check</text><rect x="330" y="150" width="210" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="370" y="215" font-size="22" font-family="Arial" font-weight="700">Browser / Log</text><rect x="590" y="150" width="210" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="638" y="215" font-size="22" font-family="Arial" font-weight="700">FastAPI</text><rect x="850" y="150" width="210" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="895" y="215" font-size="22" font-family="Arial" font-weight="700">PostgreSQL</text><path d="M280 205 H330 M540 205 H590 M800 205 H850" stroke="#334155" stroke-width="5"/><rect x="220" y="390" width="760" height="150" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="340" y="450" font-size="27" font-family="Arial" font-weight="700">Request / Response Contract must agree</text><text x="300" y="495" font-size="21" font-family="Arial">URL · Method · DTO · Status · JSON · persisted data · UI</text><text x="80" y="630" font-size="22" font-family="Arial" font-weight="700">Typed does not mean runtime-safe. Evidence still matters.</text></svg>