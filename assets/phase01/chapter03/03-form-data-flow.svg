<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#111827">Form 입력 데이터의 흐름</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="130" y="270" width="300" height="180" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="280" y="335" font-size="32" font-weight="700">사용자 입력</text><text x="280" y="385" font-size="22" fill="#475569">name / email / age</text><rect x="650" y="270" width="300" height="180" rx="28" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="800" y="335" font-size="32" font-weight="700">HTML Form</text><text x="800" y="385" font-size="22" fill="#475569">input + label + button</text><rect x="1170" y="270" width="300" height="180" rx="28" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="1320" y="335" font-size="32" font-weight="700">다음 단계</text><text x="1320" y="380" font-size="22" fill="#475569">JavaScript / API</text><g stroke="#64748b" stroke-width="6"><line x1="430" y1="360" x2="630" y2="360"/><line x1="950" y1="360" x2="1150" y2="360"/></g><g fill="#64748b"><polygon points="630,360 605,345 605,375"/><polygon points="1150,360 1125,345 1125,375"/></g><rect x="360" y="585" width="880" height="120" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="635" font-size="26" font-weight="700" fill="#9a3412">Chapter 03에서는 입력 화면을 만들고,</text><text x="800" y="675" font-size="24" fill="#9a3412">실제 전송/처리는 이후 JavaScript와 API 단계에서 연결합니다.</text></g></svg>