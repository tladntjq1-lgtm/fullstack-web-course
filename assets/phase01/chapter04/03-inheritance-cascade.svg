<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">Inheritance & Cascade</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="220" width="390" height="460" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="315" y="285" font-size="30" font-weight="700">상속 Inheritance</text><rect x="205" y="350" width="220" height="75" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="315" y="397" font-size="24">body { color: #334155; }</text><line x1="315" y1="425" x2="315" y2="500" stroke="#64748b" stroke-width="5"/><polygon points="315,520 302,497 328,497" fill="#64748b"/><rect x="205" y="525" width="220" height="75" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="315" y="570" font-size="23">p inherits color</text><rect x="605" y="220" width="870" height="460" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1040" y="285" font-size="30" font-weight="700">Cascade / 우선순위</text><text x="760" y="380" font-size="25" fill="#475569">Element selector</text><text x="1040" y="380" font-size="25" fill="#475569">Class selector</text><text x="1320" y="380" font-size="25" fill="#475569">ID selector</text><text x="760" y="455" font-size="30" fill="#2563eb">p</text><text x="1040" y="455" font-size="30" fill="#0f766e">.notice</text><text x="1320" y="455" font-size="30" fill="#c2410c">#important</text><text x="1040" y="565" font-size="28" font-weight="700">더 구체적인 규칙이 이길 수 있습니다</text><text x="1040" y="615" font-size="22" fill="#64748b">같은 수준이면 뒤에 선언된 규칙이 적용될 수 있습니다.</text></g><text x="800" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#475569">CSS는 '누구에게 적용되는가'와 '어떤 규칙이 최종적으로 이기는가'를 함께 이해해야 합니다.</text></svg>