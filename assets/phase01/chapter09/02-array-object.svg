<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">Object와 Array로 회원 데이터 표현하기</text><g font-family="Arial,sans-serif"><rect x="130" y="220" width="560" height="430" rx="26" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="410" y="285" text-anchor="middle" font-size="34" font-weight="700" fill="#1e3a8a">Object</text><text x="190" y="355" font-size="25" fill="#334155">member = {</text><text x="230" y="405" font-size="25" fill="#334155">id: 1,</text><text x="230" y="455" font-size="25" fill="#334155">name: "Kim",</text><text x="230" y="505" font-size="25" fill="#334155">age: 24,</text><text x="230" y="555" font-size="25" fill="#334155">active: true</text><text x="190" y="605" font-size="25" fill="#334155">}</text><rect x="910" y="220" width="560" height="430" rx="26" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="1190" y="285" text-anchor="middle" font-size="34" font-weight="700" fill="#166534">Array</text><text x="970" y="355" font-size="25" fill="#334155">members = [</text><text x="1010" y="410" font-size="25" fill="#334155">{ id: 1, name: "Kim" },</text><text x="1010" y="465" font-size="25" fill="#334155">{ id: 2, name: "Lee" },</text><text x="1010" y="520" font-size="25" fill="#334155">{ id: 3, name: "Park" }</text><text x="970" y="575" font-size="25" fill="#334155">]</text><line x1="690" y1="435" x2="890" y2="435" stroke="#64748b" stroke-width="5"/><polygon points="890,435 862,420 862,450" fill="#64748b"/><text x="790" y="400" text-anchor="middle" font-size="22" fill="#475569">여러 객체를 묶기</text><rect x="370" y="730" width="860" height="90" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="800" y="785" text-anchor="middle" font-size="25" font-weight="700" fill="#312e81">실제 API의 JSON 데이터도 이런 객체와 배열 구조로 자주 전달됩니다.</text></g></svg>