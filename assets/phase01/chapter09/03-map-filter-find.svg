<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#111827">map · filter · find</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="240" width="420" height="390" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="300" y="305" font-size="34" font-weight="700" fill="#1e3a8a">map()</text><text x="300" y="355" font-size="23" fill="#334155">모든 요소를 변환</text><text x="300" y="420" font-size="22" fill="#475569">회원 객체들</text><text x="300" y="465" font-size="27">↓</text><text x="300" y="515" font-size="22" fill="#475569">회원 이름 배열</text><text x="300" y="570" font-size="21" fill="#64748b">["Kim", "Lee", "Park"]</text><rect x="590" y="240" width="420" height="390" rx="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="800" y="305" font-size="34" font-weight="700" fill="#166534">filter()</text><text x="800" y="355" font-size="23" fill="#334155">조건에 맞는 여러 요소</text><text x="800" y="420" font-size="22" fill="#475569">전체 회원</text><text x="800" y="465" font-size="27">↓</text><text x="800" y="515" font-size="22" fill="#475569">활성 회원만</text><text x="800" y="570" font-size="21" fill="#64748b">active === true</text><rect x="1090" y="240" width="420" height="390" rx="26" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="1300" y="305" font-size="34" font-weight="700" fill="#9a3412">find()</text><text x="1300" y="355" font-size="23" fill="#334155">조건에 맞는 첫 요소</text><text x="1300" y="420" font-size="22" fill="#475569">전체 회원</text><text x="1300" y="465" font-size="27">↓</text><text x="1300" y="515" font-size="22" fill="#475569">id = 2 회원 하나</text><text x="1300" y="570" font-size="21" fill="#64748b">{ id: 2, ... }</text><rect x="280" y="720" width="1040" height="90" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="800" y="775" font-size="25" font-weight="700" fill="#0f172a">변환 = map · 여러 개 선택 = filter · 하나 찾기 = find</text></g></svg>