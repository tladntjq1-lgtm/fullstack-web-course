<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">Function = Input → Logic → Output</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="170" y="300" width="300" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="320" y="365" font-size="32" font-weight="700" fill="#1e3a8a">Input</text><text x="320" y="415" font-size="24" fill="#334155">name, age, role</text><rect x="650" y="300" width="300" height="180" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="800" y="365" font-size="32" font-weight="700" fill="#166534">Function</text><text x="800" y="415" font-size="24" fill="#334155">판단 · 계산 · 변환</text><rect x="1130" y="300" width="300" height="180" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="1280" y="365" font-size="32" font-weight="700" fill="#9a3412">Output</text><text x="1280" y="415" font-size="24" fill="#334155">return value</text><line x1="470" y1="390" x2="630" y2="390" stroke="#64748b" stroke-width="5"/><polygon points="630,390 605,376 605,404" fill="#64748b"/><line x1="950" y1="390" x2="1110" y2="390" stroke="#64748b" stroke-width="5"/><polygon points="1110,390 1085,376 1085,404" fill="#64748b"/><rect x="360" y="590" width="880" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="800" y="640" font-size="26" font-weight="700" fill="#0f172a">예: getMemberLabel(member)</text><text x="800" y="685" font-size="23" fill="#475569">회원 객체를 받아 화면에 사용할 문자열을 반환</text></g></svg>