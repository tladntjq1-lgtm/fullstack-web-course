<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#111827">회원 데이터에서 화면 데이터로</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="280" width="320" height="220" rx="24" fill="#fff" stroke="#334155" stroke-width="3"/><text x="280" y="340" font-size="30" font-weight="700">members</text><text x="280" y="390" font-size="22" fill="#475569">Array of Objects</text><text x="280" y="440" font-size="21" fill="#64748b">원본 회원 데이터</text><rect x="640" y="280" width="320" height="220" rx="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/><text x="800" y="340" font-size="30" font-weight="700" fill="#312e81">함수 + 배열 메서드</text><text x="800" y="390" font-size="22" fill="#475569">filter / map / find</text><text x="800" y="440" font-size="21" fill="#64748b">필요한 데이터로 가공</text><rect x="1160" y="280" width="320" height="220" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="1320" y="340" font-size="30" font-weight="700" fill="#134e4a">UI 준비 데이터</text><text x="1320" y="390" font-size="22" fill="#475569">이름 · 상태 · 상세</text><text x="1320" y="440" font-size="21" fill="#64748b">다음 장 DOM에서 사용</text><line x1="440" y1="390" x2="620" y2="390" stroke="#64748b" stroke-width="5"/><polygon points="620,390 595,376 595,404" fill="#64748b"/><line x1="960" y1="390" x2="1140" y2="390" stroke="#64748b" stroke-width="5"/><polygon points="1140,390 1115,376 1115,404" fill="#64748b"/><rect x="280" y="650" width="1040" height="100" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="710" font-size="25" font-weight="700" fill="#9a3412">Chapter 09는 데이터를 준비하고, Chapter 10에서 그 데이터를 실제 HTML 화면으로 렌더링합니다.</text></g></svg>