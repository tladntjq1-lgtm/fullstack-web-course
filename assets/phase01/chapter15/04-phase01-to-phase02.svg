<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><text x="800" y="90" text-anchor="middle" font-size="48" font-family="Arial" font-weight="700">Phase 1 → Phase 2</text><g font-family="Arial" text-anchor="middle"><rect x="160" y="260" width="520" height="260" rx="30" fill="#eef3ff" stroke="#333"/><text x="420" y="340" font-size="36" font-weight="700">Phase 1 Frontend</text><text x="420" y="400" font-size="26">HTML · CSS · JavaScript</text><text x="420" y="445" font-size="26">DOM · Event · fetch</text><rect x="920" y="260" width="520" height="260" rx="30" fill="#eefaf0" stroke="#333"/><text x="1180" y="340" font-size="36" font-weight="700">Phase 2 Backend</text><text x="1180" y="400" font-size="26">FastAPI · REST API</text><text x="1180" y="445" font-size="26">PostgreSQL · CRUD · ORM</text><line x1="680" y1="390" x2="920" y2="390" stroke="#333" stroke-width="5"/><polygon points="900,375 930,390 900,405" fill="#333"/><text x="800" y="620" font-size="30">지금 사용한 API를 다음 과정에서 직접 만든다.</text><text x="800" y="675" font-size="24">Frontend 소비자 → Backend 제공자</text></g></svg>