<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="95" font-size="48" font-family="Arial, sans-serif" font-weight="700">HTTP Request / Response</text>
<rect x="120" y="250" width="420" height="250" rx="28" fill="#eef4ff" stroke="#5b7cfa" stroke-width="4"/>
<text x="250" y="360" font-size="42" font-family="Arial, sans-serif" font-weight="700">Browser</text>
<text x="205" y="415" font-size="28" font-family="Arial, sans-serif">Client</text>
<rect x="1060" y="250" width="420" height="250" rx="28" fill="#eefbf3" stroke="#34a853" stroke-width="4"/>
<text x="1200" y="360" font-size="42" font-family="Arial, sans-serif" font-weight="700">Server</text>
<text x="1175" y="415" font-size="28" font-family="Arial, sans-serif">API / Backend</text>
<line x1="560" y1="320" x2="1040" y2="320" stroke="#333" stroke-width="5" marker-end="url(#a)"/>
<text x="700" y="285" font-size="30" font-family="Arial, sans-serif">Request</text>
<line x1="1040" y1="440" x2="560" y2="440" stroke="#333" stroke-width="5" marker-end="url(#a)"/>
<text x="700" y="500" font-size="30" font-family="Arial, sans-serif">Response</text>
<text x="240" y="690" font-size="30" font-family="Arial, sans-serif">GET /members</text>
<text x="960" y="690" font-size="30" font-family="Arial, sans-serif">200 OK + JSON</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
</svg>