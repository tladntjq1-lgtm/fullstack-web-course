<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">How a Web Application Works</text><text x="800" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#475569">브라우저에서 데이터베이스까지의 기본 흐름</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="300" width="250" height="180" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="215" y="365" font-size="34" font-weight="700">Browser</text><text x="215" y="410" font-size="22" fill="#475569">HTML · CSS · JS</text><rect x="470" y="300" width="250" height="180" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="595" y="365" font-size="34" font-weight="700">HTTP</text><text x="595" y="410" font-size="22" fill="#475569">Request / Response</text><rect x="850" y="300" width="250" height="180" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="975" y="365" font-size="34" font-weight="700">API</text><text x="975" y="410" font-size="22" fill="#475569">JSON Data</text><rect x="1230" y="300" width="280" height="180" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1370" y="365" font-size="34" font-weight="700">Backend + DB</text><text x="1370" y="410" font-size="22" fill="#475569">FastAPI · PostgreSQL</text><g stroke="#64748b" stroke-width="5"><line x1="340" y1="390" x2="450" y2="390"/><line x1="720" y1="390" x2="830" y2="390"/><line x1="1100" y1="390" x2="1210" y2="390"/></g><g fill="#64748b"><polygon points="450,390 430,378 430,402"/><polygon points="830,390 810,378 810,402"/><polygon points="1210,390 1190,378 1190,402"/></g><rect x="290" y="610" width="1020" height="140" rx="28" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="800" y="665" font-size="28" font-weight="700" fill="#312e81">Phase 01에서는 어디까지?</text><text x="800