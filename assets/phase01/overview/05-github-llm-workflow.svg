<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">GitHub + LLM Learning Workflow</text><text x="800" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#475569">배포, 실습, 이해, 제출을 하나의 흐름으로 연결합니다</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="270" width="250" height="160" rx="26" fill="#fff" stroke="#334155" stroke-width="3"/><text x="215" y="330" font-size="29" font-weight="700">Course Repo</text><text x="215" y="375" font-size="21" fill="#475569">Public GitHub</text><rect x="410" y="270" width="250" height="160" rx="26" fill="#fff" stroke="#334155" stroke-width="3"/><text x="535" y="330" font-size="29" font-weight="700">Fork / Clone</text><text x="535" y="375" font-size="21" fill="#475569">Student Repo</text><rect x="730" y="270" width="250" height="160" rx="26" fill="#fff" stroke="#334155" stroke-width="3"/><text x="855" y="330" font-size="29" font-weight="700">VS Code</text><text x="855" y="375" font-size="21" fill="#475569">실습 · 수정 · 실행</text><rect x="1050" y="270" width="250" height="160" rx="26" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1175" y="330" font-size="29" font-weight="700">LLM</text><text x="1175" y="370" font-size="20" fill="#475569">질문 · 오류 분석</text><text x="1175" y="400" font-size="20" fill="#475569">설명 · 검증</text><g stroke="#64748b" stroke-width="5"><line x1="340" y1="350" x2="390" y2="350"/><line x1="660" y1="350" x2="710" y2="350"/><line x1="980" y1="350" x2="1030" y2="350"/></g><g fill="#64748b"><polygon points="390,350 370,338 370,362"/><polygon points="710,350 690,338 690,362"/><polygon points="1030,350 1010,338 1010,362"/></g><rect x="440" y="565" width="300" height="140" rx="26" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="590" y="620" font-size="28" font-weight="700" fill="#134e4a">Commit / Push</text><text x="590" y="662" font-size="21" fill="#134e4a">학습 과정 기록</text><rect x="860" y="565" width="300" height="140" rx="26" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="1010" y="620" font-size="28" font-weight="700" fill="#312e81">Submit URL</text><text x="1010" y="662" font-size="21" fill="#312e81">GitHub 과제 제출</text><line x1="855" y1="430" x2="590" y2="545" stroke="#64748b" stroke-width="4"/><line x1="740" y1="635" x2="840" y2="635" stroke="#64748b" stroke-width="4"/><polygon points="840,635 820,623 820,647" fill="#64748b"/><rect x="280" y="770" width="1040" height="75" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="818" font-size="24" font-weight="700" fill="#9a3412">LLM은 정답 복사 도구가 아니라 이해를 넓히고 결과를 검증하는 학습 파트너입니다.</text></g></svg>