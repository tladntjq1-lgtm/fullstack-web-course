<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">One Project, Step by Step</text><text x="800" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#475569">회원 관리 화면이 강의와 함께 성장합니다</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="105" y="285" width="280" height="190" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="245" y="345" font-size="28" font-weight="700">1. HTML Page</text><text x="245" y="395" font-size="21" fill="#475569">회원 목록 구조</text><text x="245" y="430" font-size="21" fill="#475569">폼 · 테이블</text><rect x="465" y="285" width="280" height="190" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="605" y="345" font-size="28" font-weight="700">2. Styled Page</text><text x="605" y="395" font-size="21" fill="#475569">CSS Layout</text><text x="605" y="430" font-size="21" fill="#475569">Responsive UI</text><rect x="825" y="285" width="280" height="190" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="965" y="345" font-size="28" font-weight="700">3. Interactive</text><text x="965" y="395" font-size="21" fill="#475569">DOM · Event</text><text x="965" y="430" font-size="21" fill="#475569">검색 · 추가 · 삭제</text><rect x="1185" y="285" width="310" height="190" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1340" y="345" font-size="28" font-weight="700">4. API Connected</text><text x="1340" y="395" font-size="21" fill="#475569">fetch() · JSON</text><text x="1340" y="430" font-size="21" fill="#475569">Provided API</text><g stroke="#64748b" stroke-width="5"><line x1="385" y1="380" x2="445" y2="380"/><line x1="745" y1="380" x2="805" y2="380"/><line x1="1105" y1="380" x2="1165" y2="380"/></g><g fill="#64748b"><polygon points="445,380 425,368 425,392"/><polygon points="805,380 785,368 785,392"/><polygon points="1165,380 1145,368 1145,392"/></g><rect x="340" y="620" width="920" height="120" rx="26" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="670" font-size="28" font-weight="700" fill="#9a3412">핵심 원칙</text><text x="800" y="712" font-size="23" fill="#9a3412">매 강의마다 새 프로젝트를 버리지 않고, 같은 결과물을 계속 확장합니다.</text></g></svg>