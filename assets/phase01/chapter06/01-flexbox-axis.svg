<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Flexbox: Main Axis & Cross Axis</text><rect x="220" y="220" width="1160" height="430" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3"/><g font-family="Arial,sans-serif"><rect x="330" y="340" width="220" height="140" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="690" y="340" width="220" height="140" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="1050" y="340" width="220" height="140" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="440" y="420" text-anchor="middle" font-size="30" font-weight="700">Item 1</text><text x="800" y="420" text-anchor="middle" font-size="30" font-weight="700">Item 2</text><text x="1160" y="420" text-anchor="middle" font-size="30" font-weight="700">Item 3</text><line x1="310" y1="555" x2="1290" y2="555" stroke="#2563eb" stroke-width="6"/><polygon points="1290,555 1260,538 1260,572" fill="#2563eb"/><text x="800" y="610" text-anchor="middle" font-size="28" fill="#1d4ed8">Main Axis → justify-content</text><line x1="255" y1="250" x2="255" y2="620" stroke="#16a34a" stroke-width="6"/><polygon points="255,620 238,590 272,590" fill="#16a34a"/><text x="150" y="445" transform="rotate(-90 150 445)" text-anchor="middle" font-size="28" fill="#15803d">Cross Axis → align-items</text></g><text x="800" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#475569">Flexbox는 한 방향의 배치와 정렬에 강합니다.</text></svg>