<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">CSS Grid: Rows & Columns</text><g font-family="Arial,sans-serif"><rect x="300" y="210" width="1000" height="480" rx="20" fill="#fff" stroke="#334155" stroke-width="3"/><line x1="633" y1="210" x2="633" y2="690" stroke="#64748b" stroke-width="3"/><line x1="966" y1="210" x2="966" y2="690" stroke="#64748b" stroke-width="3"/><line x1="300" y1="450" x2="1300" y2="450" stroke="#64748b" stroke-width="3"/><g font-size="28" font-weight="700" text-anchor="middle"><text x="466" y="340">1</text><text x="800" y="340">2</text><text x="1133" y="340">3</text><text x="466" y="580">4</text><text x="800" y="580">5</text><text x="1133" y="580">6</text></g><text x="800" y="755" text-anchor="middle" font-size="28" fill="#1d4ed8">grid-template-columns: repeat(3, 1fr)</text><text x="800" y="810" text-anchor="middle" font-size="26" fill="#475569">Grid는 행과 열을 함께 다루는 2차원 레이아웃에 강합니다.</text></g></svg>