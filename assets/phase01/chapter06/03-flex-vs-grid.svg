<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Flexbox vs Grid</text><g font-family="Arial,sans-serif"><rect x="140" y="210" width="580" height="480" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="430" y="280" text-anchor="middle" font-size="38" font-weight="700" fill="#1d4ed8">Flexbox</text><text x="430" y="330" text-anchor="middle" font-size="24" fill="#334155">한 방향 배치</text><rect x="220" y="410" width="120" height="110" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="370" y="410" width="120" height="110" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="520" y="410" width="120" height="110" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="430" y="610" text-anchor="middle" font-size="24">메뉴 · 버튼 그룹 · 툴바</text><rect x="880" y="210" width="580" height="480" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1170" y="280" text-anchor="middle" font-size="38" font-weight="700" fill="#15803d">Grid</text><text x="1170" y="330" text-anchor="middle" font-size="24" fill="#334155">행 + 열 배치</text><g fill="#fff" stroke="#16a34a" stroke-width="2"><rect x="950" y="390" width="130" height="100" rx="14"/><rect x="1110" y="390" width="130" height="100" rx="14"/><rect x="1270" y="390" width="130" height="100" rx="14"/><rect x="950" y="520" width="130" height="100" rx="14"/><rect x="1110" y="520" width="130" height="100" rx="14"/><rect x="1270" y="520" width="130" height="100" rx="14"/></g><text x="1170" y="660" text-anchor="middle" font-size="24">카드 목록 · 대시보드 · 전체 레이아웃</text><text x="800" y="790" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">둘 중 하나만 고르는 것이 아니라, 목적에 맞게 함께 사용합니다.</text></g></svg>