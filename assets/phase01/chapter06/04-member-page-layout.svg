<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0f172a">Member Management Layout</text><g font-family="Arial,sans-serif"><rect x="180" y="150" width="1240" height="100" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="250" y="210" font-size="28" font-weight="700">Header</text><text x="1170" y="210" font-size="24">Home · Members · Add</text><rect x="180" y="285" width="1240" height="130" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="250" y="345" font-size="28" font-weight="700">Toolbar</text><text x="250" y="385" font-size="22">Search input + Action buttons → Flexbox</text><rect x="180" y="450" width="1240" height="300" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="250" y="505" font-size="28" font-weight="700">Member Cards → Grid</text><g fill="#fff" stroke="#16a34a" stroke-width="2"><rect x="250" y="550" width="300" height="140" rx="18"/><rect x="650" y="550" width="300" height="140" rx="18"/><rect x="1050" y="550" width="300" height="140" rx="18"/></g><g font-size="22" text-anchor="middle" fill="#334155"><text x="400" y="625">Member 1</text><text x="800" y="625">Member 2</text><text x="1200" y="625">Member 3</text></g><text x="800" y="830" text-anchor="middle" font-size="28" fill="#475569">Flexbox는 내부 정렬, Grid는 카드 영역 배치에 사용</text></g></svg>