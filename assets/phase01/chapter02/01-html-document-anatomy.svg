<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#111827">HTML Document Anatomy</text><text x="800" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#475569">웹 문서는 계층 구조로 구성됩니다</text><g font-family="Arial,sans-serif"><rect x="170" y="200" width="1260" height="560" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="220" y="255" font-size="30" font-weight="700" fill="#0f172a">&lt;html&gt;</text><rect x="250" y="300" width="1100" height="150" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300" y="350" font-size="28" font-weight="700" fill="#1d4ed8">&lt;head&gt;</text><text x="300" y="395" font-size="22" fill="#334155">문서 정보: charset, title, metadata</text><rect x="250" y="490" width="1100" height="210" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="300" y="540" font-size="28" font-weight="700" fill="#047857">&lt;body&gt;</text><text x="300" y="585" font-size="22" fill="#334155">사용자에게 보이는 실제 콘텐츠</text><rect x="350" y="615" width="250" height="55" rx="14" fill="#fff" stroke="#94a3b8"/><text x="475" y="650" text-anchor="middle" font-size="21">&lt;header&gt;</text><rect x="675" y="615" width="250" height="55" rx="14" fill="#fff" stroke="#94a3b8"/><text x="800" y="650" text-anchor="middle" font-size="21">&lt;main&gt;</text><rect x="1000" y="615" width="250" height="55" rx="14" fill="#fff" stroke="#94a3b8"/><text x="1125" y="650" text-anchor="middle" font-size="21">&lt;footer&gt;</text></g></svg>