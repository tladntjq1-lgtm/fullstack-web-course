<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="85" text-anchor="middle" font-family="Arial" font-size="46" font-weight="700">Member Page: From Plain HTML to Semantic Structure</text><g font-family="Arial" text-anchor="middle"><rect x="120" y="250" width="360" height="360" rx="28" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="300" y="315" font-size="29" font-weight="700">Before</text><text x="300" y="375" font-size="22">h1 + p + ul</text><text x="300" y="420" font-size="22">내용은 보이지만</text><text x="300" y="455" font-size="22">구조의 의미가 약함</text><line x1="520" y1="430" x2="730" y2="430" stroke="#64748b" stroke-width="6"/><polygon points="730,430 700,412 700,448" fill="#64748b"/><rect x="770" y="190" width="700" height="480" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1120" y="245" font-size="29" font-weight="700">After</text><rect x="840" y="290" width="560" height="70" rx="15" fill="#dbeafe"/><text x="1120" y="335" font-size="24">header</text><rect x="840" y="390" width="560" height="170" rx="15" fill="#ecfdf5"/><text x="1120" y="435" font-size="24">main</text><text x="1120" y="485" font-size="21">section: 회원 소개</text><text x="1120" y="525" font-size="21">section: 학습 목표</text><rect x="840" y="590" width="560" height="55" rx="15" fill="#f3e8ff"/><text x="1120" y="625" font-size="22">footer</text><text x="800" y="790" font-size="26" font-weight="700" fill="#0f172a">시멘틱 태그는 화면 모양보다 문서의 의미와 구조를 명확하게 합니다.</text></g></svg>