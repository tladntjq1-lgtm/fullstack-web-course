<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">변수와 자료형</text><g font-family="Arial,sans-serif"><rect x="170" y="210" width="520" height="440" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="430" y="275" text-anchor="middle" font-size="32" font-weight="700">변수 = 값을 담는 이름표</text><rect x="250" y="340" width="360" height="90" rx="18" fill="#eef2ff"/><text x="430" y="397" text-anchor="middle" font-size="26">const memberName = "길동"</text><rect x="250" y="470" width="360" height="90" rx="18" fill="#ecfeff"/><text x="430" y="527" text-anchor="middle" font-size="26">let age = 25</text><rect x="850" y="210" width="580" height="440" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1140" y="275" text-anchor="middle" font-size="32" font-weight="700">대표 자료형</text><text x="950" y="355" font-size="26">String</text><text x="1160" y="355" font-size="24" fill="#475569">"Gilbert"</text><text x="950" y="425" font-size="26">Number</text><text x="1160" y="425" font-size="24" fill="#475569">42</text><text x="950" y="495" font-size="26">Boolean</text><text x="1160" y="495" font-size="24" fill="#475569">true / false</text><text x="950" y="565" font-size="26">undefined</text><text x="1160" y="565" font-size="24" fill="#475569">값이 아직 없음</text><rect x="300" y="725" width="1000" height="90" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#9a3412">자료형은 '이 값이 어떤 종류의 데이터인가?'를 알려주는 정보입니다.</text></g></svg>