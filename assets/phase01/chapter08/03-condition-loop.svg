<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">조건문과 반복문</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="130" y="210" width="590" height="470" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="425" y="275" font-size="32" font-weight="700">조건문 if</text><rect x="275" y="340" width="300" height="90" rx="18" fill="#eef2ff"/><text x="425" y="395" font-size="25">age ≥ 20 ?</text><line x1="425" y1="430" x2="425" y2="500" stroke="#64748b" stroke-width="4"/><polygon points="425,500 413,480 437,480" fill="#64748b"/><text x="300" y="535" font-size="22">Yes → 성인</text><text x="550" y="535" font-size="22">No → 미성년</text><rect x="880" y="210" width="590" height="470" rx="28" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1175" y="275" font-size="32" font-weight="700">반복문 for</text><rect x="1010" y="340" width="330" height="80" rx="18" fill="#ecfeff"/><text x="1175" y="390" font-size="23">members 3명</text><line x1="1175" y1="420" x2="1175" y2="485" stroke="#64748b" stroke-width="4"/><polygon points="1175,485 1163,465 1187,465" fill="#64748b"/><text x="1175" y="535" font-size="23">1명씩 꺼내 같은 작업 반복</text><text x="1175" y="585" font-size="21" fill="#475569">출력 · 검사 · 계산</text><rect x="250" y="735" width="1100" height="85" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="788" font-size="24" font-weight="700" fill="#9a3412">조건문은 '선택', 반복문은 '같은 작업을 여러 데이터에 적용'합니다.</text></g></svg>