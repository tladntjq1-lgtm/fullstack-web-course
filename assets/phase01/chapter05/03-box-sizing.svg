<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">box-sizing 이해하기</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="140" y="220" width="560" height="420" rx="28" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="420" y="280" font-size="34" font-weight="700">content-box</text><rect x="250" y="350" width="340" height="160" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="420" y="420" font-size="24">width = content</text><text x="420" y="460" font-size="21" fill="#475569">padding + border가 바깥으로 추가</text><text x="420" y="580" font-size="24" fill="#b45309">최종 크기가 예상보다 커질 수 있음</text><rect x="900" y="220" width="560" height="420" rx="28" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="1180" y="280" font-size="34" font-weight="700">border-box</text><rect x="1010" y="350" width="340" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1180" y="420" font-size="24">width = content + padding + border</text><text x="1180" y="460" font-size="21" fill="#475569">지정한 폭 안에 포함</text><text x="1180" y="580" font-size="24" fill="#166534">레이아웃 계산이 더 단순</text><rect x="430" y="710" width="740" height="90" rx="20" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="800" y="765" font-size="26" font-weight="700" fill="#312e81">초보자 프로젝트에서는 * { box-sizing: border-box; } 권장</text></g></svg>