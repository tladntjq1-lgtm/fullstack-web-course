<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">CSS Box Model</text><rect x="250" y="190" width="1100" height="560" rx="28" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="800" y="235" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">margin</text><rect x="360" y="285" width="880" height="370" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="800" y="330" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">border</text><rect x="475" y="380" width="650" height="180" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="800" y="425" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">padding</text><rect x="610" y="455" width="380" height="80" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="800" y="507" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">content</text><text x="800" y="820" text-anchor="middle" font-family="Arial" font-size="24" fill="#475569">Element size = content + padding + border, while margin creates outer spacing</text></svg>