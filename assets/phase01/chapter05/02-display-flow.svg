<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">display: block vs inline vs inline-block</text><g font-family="Arial,sans-serif"><text x="150" y="190" font-size="30" font-weight="700">block</text><rect x="150" y="230" width="1100" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="700" y="285" text-anchor="middle" font-size="25">한 줄 전체를 차지</text><rect x="150" y="340" width="1100" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="700" y="395" text-anchor="middle" font-size="25">다음 요소는 아래 줄</text><text x="150" y="510" font-size="30" font-weight="700">inline</text><rect x="150" y="550" width="220" height="80" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="260" y="600" text-anchor="middle" font-size="24">A</text><rect x="390" y="550" width="220" height="80" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="500" y="600" text-anchor="middle" font-size="24">B</text><rect x="630" y="550" width="220" height="80" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="740" y="600" text-anchor="middle" font-size="24">C</text><text x="150" y="720" font-size="30" font-weight="700">inline-block</text><rect x="400" y="680" width="250" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="525" y="745" text-anchor="middle" font-size="24">width / height</text><rect x="680" y="680" width="250" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="805" y="745" text-anchor="middle" font-size="24">가능 + 한 줄 배치</text></g></svg>