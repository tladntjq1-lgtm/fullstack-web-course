<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="700">async / await 처리 흐름</text><g font-family="Arial,sans-serif"><rect x="180" y="200" width="1240" height="110" rx="20" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="270" text-anchor="middle" font-size="30">1. async function loadMembers()</text><rect x="180" y="350" width="1240" height="110" rx="20" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="420" text-anchor="middle" font-size="30">2. const response = await fetch(url)</text><rect x="180" y="500" width="1240" height="110" rx="20" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="570" text-anchor="middle" font-size="30">3. const data = await response.json()</text><rect x="180" y="650" width="1240" height="110" rx="20" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="720" text-anchor="middle" font-size="30">4. 데이터를 Console 또는 DOM에 사용</text></g><path d="M800 310V340M800 460V490M800 610V640" stroke="#111" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs></svg>