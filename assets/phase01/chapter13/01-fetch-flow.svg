<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="700">fetch() 데이터 요청 흐름</text><rect x="120" y="300" width="300" height="180" rx="24" fill="#fff" stroke="#111" stroke-width="3"/><text x="270" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700">Browser</text><text x="270" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">fetch(url)</text><rect x="650" y="300" width="300" height="180" rx="24" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700">Server API</text><text x="800" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">HTTP Response</text><rect x="1180" y="300" width="300" height="180" rx="24" fill="#fff" stroke="#111" stroke-width="3"/><text x="1330" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700">JavaScript</text><text x="1330" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">JSON → Object</text><path d="M420 390H640" stroke="#111" stroke-width="4" marker-end="url(#a)"/><path d="M950 390H1170" stroke="#111" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="530" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">Request</text><text x="1060" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">response.json()</text><text x="800" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="30">네트워크 요청은 즉시 끝나지 않으므로 비동기 처리가 필요합니다.</text></svg>