<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="700">Promise의 세 가지 상태</text><rect x="180" y="310" width="330" height="180" rx="28" fill="#fff" stroke="#111" stroke-width="3"/><text x="345" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">Pending</text><text x="345" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">처리 중</text><rect x="635" y="190" width="330" height="180" rx="28" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">Fulfilled</text><text x="800" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">성공</text><rect x="635" y="530" width="330" height="180" rx="28" fill="#fff" stroke="#111" stroke-width="3"/><text x="800" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">Rejected</text><text x="800" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">실패</text><path d="M510 380 C590 350,590 300,625 280" stroke="#111" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M510 420 C590 450,590 570,625 600" stroke="#111" stroke-width="4" fill="none" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="1120" y="330" font-family="Arial,sans-serif" font-size="28">Promise는 미래의 결과를 표현합니다.</text><text x="1120" y="385" font-family="Arial,sans-serif" font-size="26">fetch()는 Promise를 반환합니다.</text><text x="1120" y="440" font-family="Arial,sans-serif" font-size="26">await는 결과를 기다려 코드를 읽기 쉽게 만듭니다.</text></svg>