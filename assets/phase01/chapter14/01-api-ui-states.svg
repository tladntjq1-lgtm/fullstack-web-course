<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="80" y="90" font-size="48" font-family="Arial, sans-serif" font-weight="700">API UI States</text>
<text x="80" y="135" font-size="24" font-family="Arial, sans-serif" fill="#475569">Same screen, different data states</text>
<g font-family="Arial, sans-serif">
<rect x="90" y="220" width="320" height="420" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="135" y="285" font-size="34" font-weight="700">Loading</text>
<circle cx="250" cy="420" r="56" fill="none" stroke="#64748b" stroke-width="14" stroke-dasharray="85 55"/>
<text x="140" y="535" font-size="24" fill="#475569">데이터를 불러오는 중...</text>

<rect x="460" y="220" width="320" height="420" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="510" y="285" font-size="34" font-weight="700">Success</text>
<rect x="510" y="345" width="220" height="62" rx="12" fill="#e2e8f0"/>
<rect x="510" y="430" width="220" height="62" rx="12" fill="#e2e8f0"/>
<rect x="510" y="515" width="220" height="62" rx="12" fill="#e2e8f0"/>

<rect x="830" y="220" width="320" height="420" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="890" y="285" font-size="34" font-weight="700">Empty</text>
<text x="940" y="430" font-size="92">∅</text>
<text x="890" y="535" font-size="24" fill="#475569">표시할 데이터가 없습니다.</text>

<rect x="1200" y="220" width="320" height="420" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<text x="1265" y="285" font-size="34" font-weight="700">Error</text>
<text x="1325" y="430" font-size="92">!</text>
<text x="1255" y="535" font-size="24" fill="#475569">요청에 실패했습니다.</text>
</g>
<text x="80" y="760" font-size="30" font-family="Arial, sans-serif" font-weight="700">핵심: UI는 데이터 값만 보여주는 것이 아니라 현재 상태도 보여줘야 합니다.</text>
</svg>