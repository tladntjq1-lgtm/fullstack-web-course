<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display 연습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>display 배치 비교</h1>

  <h2>block: 한 줄씩 배치</h2>
  <div class="block-box">첫 번째 block</div>
  <div class="block-box">두 번째 block</div>

  <h2>inline: 내용 크기만큼 옆으로 배치</h2>
  <span class="inline-box">첫 번째 inline</span>
  <span class="inline-box">두 번째 inline</span>

  <h2>inline-block: 옆으로 배치하고 크기도 지정</h2>
  <a class="button-link" href="#">첫 번째 링크</a>
  <a class="button-link" href="#">두 번째 링크</a>
</body>
</html>
