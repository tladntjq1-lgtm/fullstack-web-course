<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원관리 페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>회원관리 페이지</h1>
    <p id="important" class="notice">중요 안내: 시스템 점검이 있습니다.</p>
  </header>

  <main>
      <h2>회원 목록</h2>

      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>이메일</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>홍길동</td>
            <td>hong@example.com</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="member-card">
      <h2>회원 가입</h2>

      <form id="signup-form">
        <label for="name">이름</label>
        <input id="name" type="text" placeholder="이름을 입력하세요">
        <button type="submit">가입하기</button>
      </form>
    </section>
  </main>
</body>
</html>
