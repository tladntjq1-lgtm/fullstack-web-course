<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Common Browser Events</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="170" y="230" width="340" height="180" rx="28" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="340" y="300" font-size="34" font-weight="700">click</text><text x="340" y="350" font-size="23" fill="#475569">버튼, 링크 등 클릭</text><rect x="630" y="230" width="340" height="180" rx="28" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="800" y="300" font-size="34" font-weight="700">input</text><text x="800" y="350" font-size="23" fill="#475569">입력값이 바뀔 때</text><rect x="1090" y="230" width="340" height="180" rx="28" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="1260" y="300" font-size="34" font-weight="700">submit</text><text x="1260" y="350" font-size="23" fill="#475569">폼 제출 시</text><rect x="380" y="530" width="840" height="130" rx="28" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="585" font-size="28" font-weight="700" fill="#9a3412">Event Listener</text><text x="800" y="625" font-size="22" fill="#9a3412">element.addEventListener('eventName', handler)</text></g></svg>