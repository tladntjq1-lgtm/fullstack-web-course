<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Event Flow</text><text x="800" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#475569">사용자 행동이 JavaScript 함수 실행으로 연결되는 과정</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="300" width="270" height="150" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="225" y="355" font-size="30" font-weight="700">User Action</text><text x="225" y="400" font-size="22" fill="#475569">click / input / submit</text><rect x="470" y="300" width="270" height="150" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="605" y="355" font-size="30" font-weight="700">Event</text><text x="605" y="400" font-size="22" fill="#475569">browser detects change</text><rect x="850" y="300" width="270" height="150" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="985" y="355" font-size="30" font-weight="700">Handler</text><text x="985" y="400" font-size="22" fill="#475569">JavaScript function</text><rect x="1230" y="300" width="270" height="150" rx="24" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><text x="1365" y="355" font-size="30" font-weight="700">UI Update</text><text x="1365" y="400" font-size="22" fill="#475569">DOM changes</text><g stroke="#64748b" stroke-width="5"><line x1="360" y1="375" x2="450" y2="375"/><line x1="740" y1="375" x2="830" y2="375"/><line x1="1120" y1="375" x2="1210" y2="375"/></g><g fill="#64748b"><polygon points="450,375 428,362 428,388"/><polygon points="830,375 808,362 808,388"/><polygon points="1210,375 1188,362 1188,388"/></g><rect x="320" y="610" width="960" height="100" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="800" y="670" font-size="28" font-weight="700" fill="#312e81">이벤트는 “사용자가 무엇을 했는가”를 코드가 알아차리는 연결 지점입니다.</text></g></svg>