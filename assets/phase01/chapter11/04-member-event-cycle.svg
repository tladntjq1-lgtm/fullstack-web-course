<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Member UI Event Cycle</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="300" cy="390" r="125" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="300" y="370" font-size="30" font-weight="700">Form</text><text x="300" y="410" font-size="21" fill="#475569">사용자 입력</text><circle cx="650" cy="390" r="125" fill="#fff" stroke="#7c3aed" stroke-width="4"/><text x="650" y="370" font-size="30" font-weight="700">Event</text><text x="650" y="410" font-size="21" fill="#475569">submit handler</text><circle cx="1000" cy="390" r="125" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="1000" y="370" font-size="30" font-weight="700">Data</text><text x="1000" y="410" font-size="21" fill="#475569">members.push()</text><circle cx="1350" cy="390" r="125" fill="#fff" stroke="#ea580c" stroke-width="4"/><text x="1350" y="370" font-size="30" font-weight="700">DOM</text><text x="1350" y="410" font-size="21" fill="#475569">renderMembers()</text><g stroke="#64748b" stroke-width="5" fill="none"><line x1="425" y1="390" x2="505" y2="390"/><line x1="775" y1="390" x2="855" y2="390"/><line x1="1125" y1="390" x2="1205" y2="390"/><path d="M1350 520 C1350 730,300 730,300 530"/></g><g fill="#64748b"><polygon points="505,390 483,377 483,403"/><polygon points="855,390 833,377 833,403"/><polygon points="1205,390 1183,377 1183,403"/><polygon points="300,530 286,553 314,553"/></g><text x="800" y="770" font-size="25" font-weight="700" fill="#334155">사용자 입력이 데이터와 화면을 함께 바꾸며 인터랙티브 UI가 됩니다.</text></g></svg>