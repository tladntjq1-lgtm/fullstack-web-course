<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">Form Submit Flow</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="110" y="270" width="280" height="170" rx="26" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="250" y="330" font-size="30" font-weight="700">Input</text><text x="250" y="375" font-size="21" fill="#475569">name / email / age</text><rect x="490" y="270" width="280" height="170" rx="26" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="630" y="330" font-size="30" font-weight="700">submit</text><text x="630" y="375" font-size="21" fill="#475569">form event</text><rect x="870" y="270" width="280" height="170" rx="26" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="1010" y="325" font-size="27" font-weight="700">preventDefault()</text><text x="1010" y="375" font-size="21" fill="#475569">기본 새로고침 중단</text><rect x="1250" y="270" width="250" height="170" rx="26" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="1375" y="325" font-size="28" font-weight="700">Read Values</text><text x="1375" y="375" font-size="20" fill="#475569">JavaScript</text><g stroke="#64748b" stroke-width="5"><line x1="390" y1="355" x2="470" y2="355"/><line x1="770" y1="355" x2="850" y2="355"/><line x1="1150" y1="355" x2="1230" y2="355"/></g><g fill="#64748b"><polygon points="470,355 448,342 448,368"/><polygon points="850,355 828,342 828,368"/><polygon points="1230,355 1208,342 1208,368"/></g><rect x="350" y="590" width="900" height="120" rx="26" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="800" y="642" font-size="27" font-weight="700" fill="#134e4a">입력값 → JavaScript 객체 → members 배열 → renderMembers()</text><text x="800" y="682" font-size="21" fill="#134e4a">이번 단계에서는 아직 서버나 DB로 전송하지 않습니다.</text></g></svg>