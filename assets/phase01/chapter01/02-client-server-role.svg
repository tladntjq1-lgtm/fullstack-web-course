<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">Client and Server</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="160" y="220" width="520" height="420" rx="36" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="420" y="300" font-size="38" font-weight="700" fill="#1e3a8a">Client</text><text x="420" y="365" font-size="28" fill="#334155">Browser</text><text x="420" y="415" font-size="25" fill="#475569">화면 표시</text><text x="420" y="455" font-size="25" fill="#475569">사용자 입력</text><text x="420" y="495" font-size="25" fill="#475569">서버에 요청</text><text x="420" y="535" font-size="25" fill="#475569">응답 결과 표시</text><rect x="920" y="220" width="520" height="420" rx="36" fill="#ecfdf5" stroke="#059669" stroke-width="4"/><text x="1180" y="300" font-size="38" font-weight="700" fill="#065f46">Server</text><text x="1180" y="365" font-size="28" fill="#334155">Web / API Server</text><text x="1180" y="415" font-size="25" fill="#475569">요청 처리</text><text x="1180" y="455" font-size="25" fill="#475569">데이터 조회</text><text x="1180" y="495" font-size="25" fill="#475569">비즈니스 로직 실행</text><text x="1180" y="535" font-size="25" fill="#475569">응답 반환</text><line x1="680" y1="365" x2="900" y2="365" stroke="#334155" stroke-width="6"/><polygon points="900,365 875,350 875,380" fill="#334155"/><text x="790" y="335" font-size="22" fill="#334155">Request</text><line x1="920" y1="500" x2="700" y2="500" stroke="#64748b" stroke-width="6"/><polygon points="700,500 725,485 725,515" fill="#64748b"/><text x="810" y="540" font-size="22" fill="#475569">Response</text><text x="800" y="760" font-size="27" font-weight="700" fill="#111827">같은 웹 서비스라도 Client와 Server의 역할은 다릅니다.</text></g></svg>