<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#111827">웹의 기본 구조: Client ↔ Server</text><text x="800" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#475569">브라우저는 요청하고, 서버는 응답합니다</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="130" y="285" width="360" height="250" rx="28" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="310" y="350" font-size="34" font-weight="700" fill="#0c4a6e">Client</text><text x="310" y="400" font-size="28" fill="#0c4a6e">Web Browser</text><text x="310" y="452" font-size="22" fill="#334155">Chrome · Edge · Safari</text><rect x="1110" y="285" width="360" height="250" rx="28" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1290" y="350" font-size="34" font-weight="700" fill="#14532d">Server</text><text x="1290" y="400" font-size="28" fill="#14532d">Web / API Server</text><text x="1290" y="452" font-size="22" fill="#334155">FastAPI는 2차 과정에서 학습</text><line x1="500" y1="350" x2="1090" y2="350" stroke="#475569" stroke-width="6"/><polygon points="1090,350 1062,334 1062,366" fill="#475569"/><text x="795" y="320" font-size="25" font-weight="700" fill="#334155">HTTP Request</text><text x="795" y="385" font-size="20" fill="#64748b">GET /members</text><line x1="1090" y1="465" x2="500" y2="465" stroke="#475569" stroke-width="6"/><polygon points="500,465 528,449 528,481" fill="#475569"/><text x="795" y="445" font-size="25" font-weight="700" fill="#334155">HTTP Response</text><text x="795" y="505" font-size="20" fill="#64748b">HTML · CSS · JS · JSON</text><rect x="300" y="650" width="1000" height="115" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="800" y="700" font-size="26" font-weight="700" fill="#9a3412">1차 과정의 초점</text><text x="800" y="742" font-size="22" fill="#9a3412">브라우저에서 화면을 만들고, 서버가 제공한 데이터를 사용하는 방법을 배웁니다.</text></g></svg>