<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#111827">브라우저는 무엇을 할까요?</text><text x="800" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#475569">HTML, CSS, JavaScript를 해석해 화면과 동작을 만듭니다</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="150" y="275" width="350" height="240" rx="28" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="325" y="340" font-size="34" font-weight="700" fill="#9a3412">HTML</text><text x="325" y="395" font-size="24" fill="#7c2d12">Structure</text><text x="325" y="450" font-size="21" fill="#475569">제목 · 목록 · 폼 · 버튼</text><rect x="625" y="275" width="350" height="240" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="800" y="340" font-size="34" font-weight="700" fill="#1e3a8a">CSS</text><text x="800" y="395" font-size="24" fill="#1e40af">Presentation</text><text x="800" y="450" font-size="21" fill="#475569">색상 · 크기 · 배치 · 반응형</text><rect x="1100" y="275" width="350" height="240" rx="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/><text x="1275" y="340" font-size="34" font-weight="700" fill="#713f12">JavaScript</text><text x="1275" y="395" font-size="24" fill="#854d0e">Behavior</text><text x="1275" y="450" font-size="21" fill="#475569">데이터 · 이벤트 · 화면 변경</text><g stroke="#64748b" stroke-width="5"><line x1="325" y1="515" x2="710" y2="650"/><line x1="800" y1="515" x2="800" y2="635"/><line x1="1275" y1="515" x2="890" y2="650"/></g><rect x="535" y="635" width="530" height="145" rx="30" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="800" y="695" font-size="32" font-weight="700" fill="#065f46">Browser</text><text x="800" y="742" font-size="23" fill="#065f46">해석 → 렌더링 → 사용자 상호작용</text></g></svg>