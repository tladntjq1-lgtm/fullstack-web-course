<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">How the Web Works</text><text x="800" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#475569">Browser → Request → Server → Response → Browser</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="130" y="300" width="300" height="190" rx="30" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><text x="280" y="370" font-size="34" font-weight="700" fill="#1e3a8a">Browser</text><text x="280" y="420" font-size="22" fill="#475569">HTML · CSS · JavaScript</text><rect x="650" y="300" width="300" height="190" rx="30" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/><text x="800" y="370" font-size="34" font-weight="700" fill="#4c1d95">Internet</text><text x="800" y="420" font-size="22" fill="#475569">HTTP Request / Response</text><rect x="1170" y="300" width="300" height="190" rx="30" fill="#ffffff" stroke="#059669" stroke-width="4"/><text x="1320" y="370" font-size="34" font-weight="700" fill="#065f46">Server</text><text x="1320" y="420" font-size="22" fill="#475569">Resource / API / Data</text><line x1="430" y1="355" x2="630" y2="355" stroke="#334155" stroke-width="6"/><polygon points="630,355 605,340 605,370" fill="#334155"/><text x="530" y="325" font-size="21" fill="#334155">Request</text><line x1="950" y1="355" x2="1150" y2="355" stroke="#334155" stroke-width="6"/><polygon points="1150,355 1125,340 1125,370" fill="#334155"/><line x1="1170" y1="445" x2="970" y2="445" stroke="#64748b" stroke-width="6"/><polygon points="970,445 995,430 995,460" fill="#64748b"/><line x1="650" y1="445" x2="450" y2="445" stroke="#64748b" stroke-width="6"/><polygon points="450,445 475,430 475,460" fill="#64748b"/><text x="1060" y="485" font-size="21" fill="#475569">Response</text><text x="540" y="485" font-size="21" fill="#475569">Response</text><rect x="260" y="630" width="1080" height="110" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="800" y="682" font-size="27" font-weight="700" fill="#312e81">Frontend는 브라우저에서 사용자가 보고 조작하는 영역입니다.</text><text x="800" y="722" font-size="22" fill="#4338ca">Backend와 Database는 이후 과정에서 이 흐름 뒤에 연결됩니다.</text></g></svg>