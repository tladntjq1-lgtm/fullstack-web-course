<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">DELETE API 상태 코드 구분</text><g font-family="Arial" font-size="25"><rect x="100" y="170" width="300" height="110" rx="18" fill="#f9fafb" stroke="#111827"/><text x="250" y="220" text-anchor="middle">204 No Content</text><text x="250" y="255" text-anchor="middle">삭제 성공</text><rect x="450" y="170" width="300" height="110" rx="18" fill="#f9fafb" stroke="#111827"/><text x="600" y="220" text-anchor="middle">404 Not Found</text><text x="600" y="255" text-anchor="middle">삭제 대상 없음</text><rect x="800" y="170" width="300" height="110" rx="18" fill="#f9fafb" stroke="#111827"/><text x="950" y="220" text-anchor="middle">500 Error</text><text x="950" y="255" text-anchor="middle">DB 처리 실패</text></g><text x="100" y="390" font-size="25" font-family="Arial">204 응답에는 Response Body를 두지 않습니다.</text><text x="100" y="440" font-size="25" font-family="Arial">삭제 대상 존재 여부는 DELETE ... RETURNING 결과로 판단할 수 있습니다.</text></svg>