<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><text x="60" y="70" font-size="34" font-family="Arial" font-weight="700">DELETE ... RETURNING 으로 존재 여부 확인</text><rect x="80" y="170" width="430" height="210" rx="18" fill="#f9fafb" stroke="#111827"/><text x="110" y="220" font-size="24" font-family="monospace">DELETE FROM members</text><text x="110" y="260" font-size="24" font-family="monospace">WHERE member_id = %s</text><text x="110" y="300" font-size="24" font-family="monospace">RETURNING member_id;</text><rect x="650" y="160" width="420" height="90" rx="18" fill="#f3f4f6" stroke="#111827"/><text x="860" y="215" text-anchor="middle" font-size="25" font-family="Arial">행 반환 → 삭제 대상 존재 → commit</text><rect x="650" y="300" width="420" height="90" rx="18" fill="#f3f4f6" stroke="#111827"/><text x="860" y="355" text-anchor="middle" font-size="25" font-family="Arial">None → 대상 없음 → 404</text></svg>