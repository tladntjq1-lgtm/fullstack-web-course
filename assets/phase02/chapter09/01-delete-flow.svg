<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="60" y="70" font-size="34" font-family="Arial, sans-serif" font-weight="700">DELETE /members/{id} 전체 흐름</text>
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
    <rect x="70" y="180" width="180" height="90" rx="18" fill="#f3f4f6" stroke="#111827"/>
    <text x="160" y="235">DELETE 요청</text>
    <rect x="320" y="180" width="180" height="90" rx="18" fill="#f3f4f6" stroke="#111827"/>
    <text x="410" y="220">FastAPI</text><text x="410" y="250">Endpoint</text>
    <rect x="570" y="180" width="180" height="90" rx="18" fill="#f3f4f6" stroke="#111827"/>
    <text x="660" y="220">PostgreSQL</text><text x="660" y="250">DELETE</text>
    <rect x="820" y="180" width="180" height="90" rx="18" fill="#f3f4f6" stroke="#111827"/>
    <text x="910" y="220">commit</text><text x="910" y="250">204</text>
    <line x1="250" y1="225" x2="320" y2="225" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
    <line x1="500" y1="225" x2="570" y2="225" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
    <line x1="750" y1="225" x2="820" y2="225" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  </g>
  <text x="75" y="380" font-size="25" font-family="Arial, sans-serif">핵심: 삭제 성공은 응답만 보는 것이 아니라 DB와 GET 재조회로 확인합니다.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
