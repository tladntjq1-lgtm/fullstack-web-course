<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">DB Query Lifecycle</text><g font-family="Arial,sans-serif" text-anchor="middle" font-size="22"><rect x="80" y="220" width="180" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="170" y="270" fill="#1e3a8a">1. Connect</text><text x="170" y="300" fill="#1e3a8a">DB 연결</text><rect x="310" y="220" width="180" height="110" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="400" y="270" fill="#365314">2. Execute</text><text x="400" y="300" fill="#365314">SQL 실행</text><rect x="540" y="220" width="180" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="630" y="270" fill="#78350f">3. Fetch</text><text x="630" y="300" fill="#78350f">결과 읽기</text><rect x="770" y="220" width="180" height="110" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="860" y="270" fill="#831843">4. Convert</text><text x="860" y="300" fill="#831843">Python Data</text><rect x="1000" y="220" width="150" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1075" y="270" fill="#4c1d95">5. Close</text><text x="1075" y="300" fill="#4c1d95">연결 정리</text><path d="M260 275H300M490 275H530M720 275H760M950 275H990" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="600" y="445" font-size="25" fill="#334155">연결 성공만으로 끝나지 않고 SQL 결과까지 확인합니다.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs></svg>