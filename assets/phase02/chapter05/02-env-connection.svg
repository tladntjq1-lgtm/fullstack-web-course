<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">환경변수와 DB 연결 정보</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="190" width="280" height="190" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><text x="230" y="235" font-size="26" font-weight="700" fill="#0f172a">.env</text><text x="230" y="280" font-size="21" fill="#334155">DB_HOST</text><text x="230" y="315" font-size="21" fill="#334155">DB_PORT</text><text x="230" y="350" font-size="21" fill="#334155">DB_NAME / USER / PASSWORD</text><rect x="460" y="190" width="280" height="190" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="245" font-size="26" font-weight="700" fill="#14532d">Python App</text><text x="600" y="290" font-size="21" fill="#166534">환경변수 읽기</text><text x="600" y="325" font-size="21" fill="#166534">연결 설정 생성</text><rect x="830" y="190" width="280" height="190" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="970" y="245" font-size="26" font-weight="700" fill="#4c1d95">PostgreSQL</text><text x="970" y="295" font-size="21" fill="#5b21b6">localhost:5432</text><text x="970" y="330" font-size="21" fill="#5b21b6">Database / Schema</text><path d="M370 285H445" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><path d="M740 285H815" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="600" y="480" font-size="24" fill="#991b1b">비밀번호를 Python 코드에 직접 작성하지 않습니다.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs></svg>