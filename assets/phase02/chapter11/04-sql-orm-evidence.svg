<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="600" y="80" font-size="34" text-anchor="middle" font-family="Arial">SQL vs ORM Evidence Check</text><g font-family="Arial"><rect x="90" y="150" width="430" height="330" rx="18" fill="#f8fafc" stroke="#64748b"/><text x="305" y="195" text-anchor="middle" font-size="28">Raw SQL</text><text x="135" y="260" font-size="23">SELECT member_id, name, email, age</text><text x="135" y="305" font-size="23">FROM members</text><text x="135" y="350" font-size="23">WHERE member_id = 1;</text><text x="305" y="425" text-anchor="middle" font-size="24">→ DB Row</text><rect x="680" y="150" width="430" height="330" rx="18" fill="#f0fdf4" stroke="#64748b"/><text x="895" y="195" text-anchor="middle" font-size="28">SQLAlchemy ORM</text><text x="725" y="260" font-size="23">select(Member)</text><text x="725" y="305" font-size="23">.where(Member.member_id == 1)</text><text x="895" y="425" text-anchor="middle" font-size="24">→ Member Object</text><text x="600" y="565" text-anchor="middle" font-size="30">Same database data, same meaning, different expression</text></g><path d="M520 315 L680 315" stroke="#475569" stroke-width="4" stroke-dasharray="10 8"/></svg>