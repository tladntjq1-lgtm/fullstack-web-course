<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Who Owns What?</text><g font-family="Arial,sans-serif"><rect x="80" y="130" width="230" height="430" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="195" y="180" text-anchor="middle" font-size="28" font-weight="700">Router</text><text x="115" y="235" font-size="20">• URL / Method</text><text x="115" y="275" font-size="20">• Request/Response</text><text x="115" y="315" font-size="20">• Status Code</text><text x="115" y="355" font-size="20">• HTTPException</text><rect x="345" y="130" width="230" height="430" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="460" y="180" text-anchor="middle" font-size="28" font-weight="700">Service</text><text x="380" y="235" font-size="20">• Business Rule</text><text x="380" y="275" font-size="20">• Flow Control</text><text x="380" y="315" font-size="20">• Conflict Check</text><text x="380" y="355" font-size="20">• Use-case Logic</text><rect x="610" y="130" width="230" height="430" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="725" y="180" text-anchor="middle" font-size="28" font-weight="700">Repository</text><text x="645" y="235" font-size="20">• SELECT</text><text x="645" y="275" font-size="20">• INSERT</text><text x="645" y="315" font-size="20">• UPDATE</text><text x="645" y="355" font-size="20">• DELETE</text><rect x="875" y="130" width="245" height="430" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="998" y="180" text-anchor="middle" font-size="28" font-weight="700">Schema / DB</text><text x="910" y="235" font-size="20">• Pydantic Contract</text><text x="910" y="275" font-size="20">• Connection Config</text><text x="910" y="315" font-size="20">• Environment</text><text x="910" y="355" font-size="20">• Shared Infra</text></g><text x="600" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#475569">핵심 질문: “이 코드는 HTTP 책임인가, 업무 규칙인가, DB 접근인가?”</text></svg>