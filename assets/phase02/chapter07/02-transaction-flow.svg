<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font:700 34px Arial,sans-serif;fill:#111}.s{font:24px Arial,sans-serif;fill:#222}.b{fill:#f5f7fb;stroke:#333;stroke-width:2}.ok{fill:#eef9f0;stroke:#2d6a3f;stroke-width:2}.er{fill:#fff1f1;stroke:#9a2b2b;stroke-width:2}.a{stroke:#333;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><text x="60" y="70" class="t">Transaction: commit 또는 rollback</text><rect x="100" y="140" width="220" height="90" rx="16" class="b"/><text x="155" y="195" class="s">BEGIN</text><line x1="320" y1="185" x2="430" y2="185" class="a"/><rect x="430" y="140" width="260" height="90" rx="16" class="b"/><text x="505" y="195" class="s">INSERT</text><line x1="690" y1="185" x2="810" y2="185" class="a"/><rect x="810" y="140" width="250" height="90" rx="16" class="b"/><text x="850" y="195" class="s">성공 여부 확인</text><line x1="935" y1="230" x2="935" y2="330" class="a"/><rect x="735" y="350" width="260" height="100" rx="16" class="ok"/><text x="790" y="410" class="s">성공 → commit()</text><line x1="860" y1="450" x2="860" y2="545" class="a"/><rect x="730" y="565" width="270" height="90" rx="16" class="ok"/><text x="775" y="620" class="s">DB 변경 확정</text><line x1="935" y1="230" x2="430" y2="350" class="a"/><rect x="140" y="350" width="300" height="100" rx="16" class="er"/><text x="185" y="410" class="s">오류 → rollback()</text><line x1="290" y1="450" x2="290" y2="545" class="a"/><rect x="130" y="565" width="320" height="90" rx="16" class="er"/><text x="175" y="620" class="s">DB 변경 취소</text></svg>