<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="70" y="90" font-size="42" font-family="Arial" font-weight="700" fill="#0f172a">Status Code Map</text><rect x="80" y="165" width="310" height="360" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="125" y="225" font-size="30" font-family="Arial" font-weight="700">Success</text><text x="125" y="295" font-size="26" font-family="Arial">200 OK</text><text x="125" y="350" font-size="24" font-family="Arial">조회 성공</text><text x="125" y="420" font-size="26" font-family="Arial">201 Created</text><text x="125" y="475" font-size="24" font-family="Arial">생성 성공</text><rect x="445" y="165" width="310" height="360" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="495" y="225" font-size="30" font-family="Arial" font-weight="700">Client Error</text><text x="495" y="295" font-size="26" font-family="Arial">400 Bad Request</text><text x="495" y="350" font-size="24" font-family="Arial">요청 문제</text><text x="495" y="420" font-size="26" font-family="Arial">404 Not Found</text><text x="495" y="475" font-size="24" font-family="Arial">자원 없음</text><rect x="810" y="165" width="310" height="360" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="860" y="225" font-size="30" font-family="Arial" font-weight="700">Server Error</text><text x="860" y="320" font-size="26" font-family="Arial">500 Internal</text><text x="860" y="365" font-size="26" font-family="Arial">Server Error</text><text x="860" y="445" font-size="24" font-family="Arial">서버 처리 실패</text><text x="80" y="610" font-size="27" font-family="Arial" fill="#334155">상태 코드는 API 소비자가 다음 행동을 판단할 수 있는 중요한 계약 정보입니다.</text></svg>