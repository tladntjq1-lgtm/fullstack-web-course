<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="70" y="90" font-size="42" font-family="Arial" font-weight="700" fill="#0f172a">response_model Flow</text><rect x="75" y="210" width="250" height="170" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="120" y="270" font-size="28" font-family="Arial" font-weight="700">Endpoint</text><text x="105" y="325" font-size="24" font-family="Arial">return Python data</text><path d="M340 295 H455" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="475" y="190" width="270" height="210" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="520" y="250" font-size="28" font-family="Arial" font-weight="700">FastAPI</text><text x="510" y="305" font-size="24" font-family="Arial">response_model</text><text x="500" y="350" font-size="23" font-family="Arial">validate + serialize</text><path d="M760 295 H870" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="890" y="210" width="235" height="170" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="940" y="270" font-size="28" font-family="Arial" font-weight="700">Client</text><text x="930" y="325" font-size="24" font-family="Arial">JSON Response</text><text x="90" y="535" font-size="27" font-family="Arial" fill="#334155">response_model은 문서용 표시만이 아니라 실제 출력 검증과 직렬화에 사용됩니다.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs></svg>