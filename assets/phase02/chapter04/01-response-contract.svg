<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="70" y="90" font-size="42" font-family="Arial" font-weight="700" fill="#0f172a">Response Contract</text><rect x="90" y="170" width="300" height="330" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="130" y="225" font-size="30" font-family="Arial" font-weight="700">Endpoint</text><text x="130" y="285" font-size="26" font-family="Arial">POST /members</text><text x="130" y="345" font-size="26" font-family="Arial">Request Body</text><text x="130" y="395" font-size="24" font-family="Arial">name, email, age</text><path d="M410 335 H535" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="555" y="150" width="540" height="380" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="210" font-size="30" font-family="Arial" font-weight="700">Response Contract</text><text x="600" y="275" font-size="25" font-family="Arial">Status: 201 Created</text><text x="600" y="330" font-size="25" font-family="Arial">Body: MemberResponse</text><text x="630" y="385" font-size="23" font-family="Arial">id: integer</text><text x="630" y="430" font-size="23" font-family="Arial">name: string</text><text x="630" y="475" font-size="23" font-family="Arial">email: string</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="90" y="620" font-size="28" font-family="Arial" fill="#334155">API는 입력뿐 아니라 출력의 형태와 상태 코드도 계약입니다.</text></svg>