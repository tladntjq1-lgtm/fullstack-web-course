<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="70" y="90" font-size="42" font-family="Arial" font-weight="700" fill="#0f172a">Swagger Response Evidence</text><rect x="90" y="155" width="1020" height="410" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><rect x="130" y="200" width="330" height="90" rx="16" fill="#dbeafe"/><text x="165" y="255" font-size="25" font-family="Arial" font-weight="700">POST /members</text><rect x="500" y="200" width="245" height="90" rx="16" fill="#dcfce7"/><text x="555" y="255" font-size="25" font-family="Arial" font-weight="700">201 Created</text><rect x="785" y="200" width="265" height="90" rx="16" fill="#f1f5f9"/><text x="830" y="255" font-size="25" font-family="Arial" font-weight="700">Response Body</text><text x="150" y="360" font-size="24" font-family="Arial">1. Execute 요청</text><text x="150" y="410" font-size="24" font-family="Arial">2. Status Code 확인</text><text x="150" y="460" font-size="24" font-family="Arial">3. Response Body 필드 확인</text><text x="150" y="510" font-size="24" font-family="Arial">4. Schemas에서 MemberResponse 확인</text><text x="90" y="625" font-size="28" font-family="Arial" fill="#334155">Evidence = 문서가 아니라 실제 실행 결과로 계약이 지켜지는지 확인하는 것</text></svg>