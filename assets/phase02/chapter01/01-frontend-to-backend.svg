<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="60" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">Frontend에서 Backend로 관점 전환</text>
  <rect x="80" y="170" width="250" height="160" rx="20" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="205" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Browser</text>
  <text x="205" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">fetch()</text>
  <rect x="475" y="170" width="250" height="160" rx="20" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">API Server</text>
  <text x="600" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">FastAPI</text>
  <rect x="870" y="170" width="250" height="160" rx="20" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="995" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Database</text>
  <text x="995" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">PostgreSQL</text>
  <path d="M330 250 H475" stroke="#0f172a" stroke-width="4" marker-end="url(#a)"/>
  <path d="M725 250 H870" stroke="#0f172a" stroke-width="4" marker-end="url(#a)"/>
  <text x="402" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">HTTP</text>
  <text x="797" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Query</text>
  <text x="600" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">1차: API를 사용한다 → 2차: API를 직접 만든다</text>
  <text x="600" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">Request를 받고, 검증하고, 처리하고, Response를 만든다.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>
</svg>