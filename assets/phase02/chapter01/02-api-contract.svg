<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="60" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">API Contract: 구현 전에 약속을 먼저 정한다</text>
  <rect x="90" y="165" width="1020" height="360" rx="24" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="140" y="225" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">GET /members</text>
  <text x="140" y="280" font-family="Arial,sans-serif" font-size="23" fill="#334155">Request</text>
  <text x="340" y="280" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Method: GET · Path: /members · Body: 없음</text>
  <line x1="140" y1="315" x2="1060" y2="315" stroke="#cbd5e1" stroke-width="2"/>
  <text x="140" y="365" font-family="Arial,sans-serif" font-size="23" fill="#334155">Success</text>
  <text x="340" y="365" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">200 OK · JSON Array</text>
  <text x="340" y="410" font-family="Arial,sans-serif" font-size="21" fill="#475569">[{ "id": 1, "name": "Kim", "email": "kim@example.com" }]</text>
  <line x1="140" y1="445" x2="1060" y2="445" stroke="#cbd5e1" stroke-width="2"/>
  <text x="140" y="495" font-family="Arial,sans-serif" font-size="23" fill="#334155">검증 기준</text>
  <text x="340" y="495" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">URL · Method · Status · Response 구조</text>
  <text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">AI에게 코드를 요청하기 전에 Input / Output / Error / 완료 조건을 먼저 정의한다.</text>
</svg>