<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="60" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">FastAPI Request 처리 흐름</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="190" width="210" height="130" rx="18" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="175" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Browser</text>
    <text x="175" y="285" text-anchor="middle" font-size="19" fill="#475569">GET /members</text>
    <rect x="355" y="190" width="210" height="130" rx="18" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="460" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Uvicorn</text>
    <text x="460" y="285" text-anchor="middle" font-size="19" fill="#475569">ASGI Server</text>
    <rect x="640" y="190" width="210" height="130" rx="18" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="745" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">FastAPI</text>
    <text x="745" y="285" text-anchor="middle" font-size="19" fill="#475569">Route Function</text>
    <rect x="925" y="190" width="210" height="130" rx="18" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text x="1030" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">JSON</text>
    <text x="1030" y="285" text-anchor="middle" font-size="19" fill="#475569">Response</text>
    <path d="M280 255 H355" stroke="#0f172a" stroke-width="4" marker-end="url(#a)"/>
    <path d="M565 255 H640" stroke="#0f172a" stroke-width="4" marker-end="url(#a)"/>
    <path d="M850 255 H925" stroke="#0f172a" stroke-width="4" marker-end="url(#a)"/>
    <text x="600" y="405" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">처음에는 DB 없이 Route → Response 흐름만 확인한다.</text>
    <text x="600" y="460" text-anchor="middle" font-size="22" fill="#475569">PostgreSQL 연결은 뒤 강의에서 추가한다.</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>
</svg>