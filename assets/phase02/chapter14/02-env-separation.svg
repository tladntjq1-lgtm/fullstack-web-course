<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.s{font-size:23px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="65" class="t">환경 분리: Frontend와 Backend 설정</text><rect x="70" y="130" width="300" height="160" rx="18" class="b"/><text x="115" y="185" class="s">Frontend .env</text><text x="95" y="230" class="s">API_BASE_URL</text><rect x="455" y="130" width="300" height="160" rx="18" class="b"/><text x="525" y="185" class="s">FastAPI .env</text><text x="490" y="230" class="s">DB_URL / CORS_ORIGINS</text><rect x="840" y="130" width="290" height="160" rx="18" class="b"/><text x="920" y="185" class="s">PostgreSQL</text><text x="885" y="230" class="s">실제 DB 연결 정보</text><line x1="370" y1="210" x2="455" y2="210" class="a"/><line x1="755" y1="210" x2="840" y2="210" class="a"/><text x="130" y="380" class="s">Development</text><text x="130" y="425" class="s">localhost / dev DB</text><text x="480" y="380" class="s">Test</text><text x="480" y="425" class="s">test API / test DB</text><text x="810" y="380" class="s">Production</text><text x="810" y="425" class="s">배포 URL / prod DB</text><text x="140" y="505" class="s">코드에 URL·비밀번호를 박아두지 않고 환경별 설정으로 분리한다.</text></svg>