<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.s{font-size:24px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="70" class="t">Origin과 CORS</text><rect x="70" y="150" width="300" height="170" rx="20" class="b"/><text x="130" y="205" class="s">Frontend</text><text x="100" y="250" class="s">http://localhost:5500</text><rect x="830" y="150" width="300" height="170" rx="20" class="b"/><text x="915" y="205" class="s">FastAPI</text><text x="875" y="250" class="s">http://localhost:8000</text><line x1="370" y1="215" x2="830" y2="215" class="a"/><text x="485" y="190" class="s">fetch()</text><line x1="830" y1="275" x2="370" y2="275" class="a"/><text x="455" y="315" class="s">Access-Control-Allow-Origin</text><text x="220" y="410" class="s">서로 다른 Origin이면 Browser가 CORS 정책을 검사한다.</text></svg>