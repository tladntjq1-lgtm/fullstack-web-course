<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.s{font-size:23px}.b{fill:#f6f7f9;stroke:#222;stroke-width:2}.danger{fill:#fff3f3;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text x="60" y="65" class="t">Trust Boundary와 Secret</text><rect x="70" y="130" width="330" height="210" rx="18" class="danger"/><text x="155" y="185" class="s">Browser</text><text x="105" y="230" class="s">사용자가 볼 수 있음</text><text x="105" y="275" class="s">JS / Network / Env 공개</text><rect x="790" y="130" width="330" height="210" rx="18" class="b"/><text x="885" y="185" class="s">Backend</text><text x="825" y="230" class="s">Server-side Secret 보관</text><text x="825" y="275" class="s">DB Password / API Key</text><line x1="400" y1="235" x2="790" y2="235" class="a"/><text x="500" y="205" class="s">HTTP Request</text><text x="135" y="430" class="s">Frontend에 넣어도 되는 값: API Base URL</text><text x="135" y="480" class="s">Frontend에 넣으면 안 되는 값: DB 비밀번호, Private API Key</text></svg>