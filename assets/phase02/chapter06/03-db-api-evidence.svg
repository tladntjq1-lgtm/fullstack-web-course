<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#f8fafc"/><style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.h{font-size:34px;font-weight:700}.s{font-size:22px}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:16}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}</style><text x="60" y="60" class="t h">DB 결과와 API 응답 Evidence 비교</text><rect x="90" y="145" width="440" height="230" class="b"/><text x="310" y="190" text-anchor="middle" class="t s">PostgreSQL / DBeaver</text><text x="125" y="245" class="t s">SELECT member_id, name, email</text><text x="125" y="285" class="t s">FROM members ORDER BY member_id;</text><text x="125" y="330" class="t s">→ 실제 행 개수와 값 확인</text><rect x="670" y="145" width="440" height="230" class="b"/><text x="890" y="190" text-anchor="middle" class="t s">Swagger /docs</text><text x="710" y="245" class="t s">GET /members → Execute</text><text x="710" y="285" class="t s">Status 200 + JSON 배열</text><text x="710" y="330" class="t s">→ DB와 같은 데이터인지 비교</text><rect x="430" y="420" width="340" height="65" class="ok"/><text x="600" y="462" text-anchor="middle" class="t s">DB Evidence = API Evidence</text></svg>