<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f8fafc"/><style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.h{font-size:34px;font-weight:700}.s{font-size:21px}.b{fill:#fff;stroke:#475569;stroke-width:2;rx:14}.a{stroke:#7c3aed;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker></defs><text x="60" y="60" class="t h">GET /members 오류가 날 때 확인 순서</text><g><rect x="55" y="175" width="190" height="110" class="b"/><text x="150" y="220" text-anchor="middle" class="t s">1. Swagger</text><text x="150" y="253" text-anchor="middle" class="t s">Status / Body</text><rect x="290" y="175" width="190" height="110" class="b"/><text x="385" y="220" text-anchor="middle" class="t s">2. FastAPI</text><text x="385" y="253" text-anchor="middle" class="t s">Endpoint / Log</text><rect x="525" y="175" width="190" height="110" class="b"/><text x="620" y="220" text-anchor="middle" class="t s">3. DB 연결</text><text x="620" y="253" text-anchor="middle" class="t s">host/db/schema</text><rect x="760" y="175" width="190" height="110" class="b"/><text x="855" y="220" text-anchor="middle" class="t s">4. SQL</text><text x="855" y="253" text-anchor="middle" class="t s">query / column</text><rect x="995" y="175" width="150" height="110" class="b"/><text x="1070" y="220" text-anchor="middle" class="t s">5. Data</text><text x="1070" y="253" text-anchor="middle" class="t s">실제 행</text></g><path d="M245 230 H290" class="a"/><path d="M480 230 H525" class="a"/><path d="M715 230 H760" class="a"/><path d="M950 230 H995" class="a"/><text x="600" y="390" text-anchor="middle" class="t s">AI에게 전체 코드를 다시 쓰게 하기 전에 Evidence로 실패 지점을 좁힌다.</text><text x="600" y="435" text-anchor="middle" class="t s">“어디가 틀렸는가?”보다 “어디까지 정상인가?”를 먼저 확인한다.</text></svg>