<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700">Swagger에서 Parameter Evidence 확인</text>
  <rect x="90" y="150" width="300" height="420" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="240" y="205" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">입력</text>
  <text x="240" y="260" text-anchor="middle" font-family="Arial" font-size="21">member_id = 1</text>
  <text x="240" y="300" text-anchor="middle" font-family="Arial" font-size="21">name = kim</text>
  <text x="240" y="340" text-anchor="middle" font-family="Arial" font-size="21">min_age = 20</text>
  <text x="240" y="420" text-anchor="middle" font-family="Arial" font-size="20">Try it out</text>
  <text x="240" y="455" text-anchor="middle" font-family="Arial" font-size="20">→ Execute</text>
  <rect x="450" y="150" width="300" height="420" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">요청</text>
  <text x="600" y="265" text-anchor="middle" font-family="Arial" font-size="20">Request URL</text>
  <text x="600" y="305" text-anchor="middle" font-family="Arial" font-size="19">/members/1</text>
  <text x="600" y="345" text-anchor="middle" font-family="Arial" font-size="19">/members?name=kim</text>
  <text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="20">Method = GET</text>
  <rect x="810" y="150" width="300" height="420" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="960" y="205" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">응답</text>
  <text x="960" y="260" text-anchor="middle" font-family="Arial" font-size="21">200 Success</text>
  <text x="960" y="300" text-anchor="middle" font-family="Arial" font-size="21">404 Not Found</text>
  <text x="960" y="340" text-anchor="middle" font-family="Arial" font-size="21">422 Validation</text>
  <text x="960" y="420" text-anchor="middle" font-family="Arial" font-size="20">Response Body JSON</text>
  <text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">코드가 아니라 Request/Response Evidence가 완료 여부를 증명합니다.</text>
</svg>