<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700">URL Contract 먼저 정의하기</text>
  <rect x="110" y="150" width="980" height="110" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="28">GET /members/{member_id}</text>
  <text x="600" y="240" text-anchor="middle" font-family="Arial" font-size="20">입력: member_id(number) → 출력: 회원 1명 또는 404</text>
  <rect x="110" y="315" width="980" height="110" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="600" y="370" text-anchor="middle" font-family="Arial" font-size="28">GET /members?name=kim&amp;min_age=20</text>
  <text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="20">입력: 선택 검색 조건 → 출력: 조건에 맞는 회원 목록</text>
  <text x="600" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">구현 전에 정할 것</text>
  <text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="21">Method · URL · Parameter · 정상 응답 · 오류 응답 · 완료 조건</text>
  <text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="22">AI에게도 먼저 이 계약을 제공한 뒤 구현을 요청합니다.</text>
</svg>