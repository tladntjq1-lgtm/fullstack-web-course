<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700">Path Parameter vs Query Parameter</text>
  <rect x="80" y="150" width="470" height="420" rx="24" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <rect x="650" y="150" width="470" height="420" rx="24" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="315" y="210" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Path Parameter</text>
  <text x="885" y="210" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Query Parameter</text>
  <text x="315" y="275" text-anchor="middle" font-family="Arial" font-size="26">GET /members/3</text>
  <text x="885" y="275" text-anchor="middle" font-family="Arial" font-size="26">GET /members?name=kim</text>
  <text x="315" y="345" text-anchor="middle" font-family="Arial" font-size="22">특정 자원 식별</text>
  <text x="885" y="345" text-anchor="middle" font-family="Arial" font-size="22">검색·필터·정렬 조건</text>
  <text x="315" y="410" text-anchor="middle" font-family="Arial" font-size="22">member_id = 3</text>
  <text x="885" y="410" text-anchor="middle" font-family="Arial" font-size="22">name = "kim"</text>
  <text x="315" y="500" text-anchor="middle" font-family="Arial" font-size="21">URL 경로 자체가 달라짐</text>
  <text x="885" y="500" text-anchor="middle" font-family="Arial" font-size="21">같은 자원에 조건을 추가</text>
  <text x="600" y="640" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">질문: “한 명을 찾는가?” vs “목록을 조건으로 좁히는가?”</text>
</svg>