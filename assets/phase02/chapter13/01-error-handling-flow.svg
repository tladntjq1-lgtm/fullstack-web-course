<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">Backend Error Handling Flow</text>
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
    <rect x="70" y="240" width="190" height="100" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/><text x="165" y="300">Request</text>
    <rect x="320" y="240" width="210" height="100" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="425" y="285">Validation /</text><text x="425" y="315">Business Rule</text>
    <rect x="590" y="240" width="200" height="100" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="690" y="300">Repository / DB</text>
    <rect x="850" y="150" width="260" height="90" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="980" y="205">Success Response</text>
    <rect x="850" y="360" width="260" height="90" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="980" y="400">HTTPException</text><text x="980" y="430">4xx / 5xx</text>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M260 290 H320"/><path d="M530 290 H590"/><path d="M790 275 C835 250 835 205 850 195"/><path d="M790 305 C835 330 835 390 850 405"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="600" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#334155">오류는 숨기지 않고 API Contract에 맞는 Status와 Message로 변환한다.</text>
</svg>