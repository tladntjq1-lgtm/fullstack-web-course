<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">Logging as Evidence</text>
  <g font-family="Arial, sans-serif" font-size="23" text-anchor="middle">
    <rect x="90" y="210" width="220" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/><text x="200" y="255">Request</text><text x="200" y="290">Method / Path</text>
    <rect x="390" y="210" width="220" height="110" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="500" y="255">Application Log</text><text x="500" y="290">INFO / WARNING / ERROR</text>
    <rect x="690" y="210" width="220" height="110" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="800" y="255">DB / Service</text><text x="800" y="290">Result / Exception</text>
    <rect x="470" y="430" width="260" height="110" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="600" y="475">Trace the Failure</text><text x="600" y="510">어디서 실패했는가?</text>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M310 265 H390"/><path d="M610 265 H690"/><path d="M800 320 C800 390 700 410 650 430"/><path d="M500 320 C500 390 550 410 575 430"/></g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#334155">print가 아니라 재현 가능한 진단 정보로 남긴다.</text>
</svg>