<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111827">UPDATE 오류 상태 매핑</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="170" width="1020" height="95" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <text x="130" y="210" font-size="28" font-weight="700" fill="#991b1b">404 Not Found</text>
    <text x="420" y="210" font-size="23" fill="#374151">수정할 member_id가 존재하지 않음</text>
    <rect x="90" y="300" width="1020" height="95" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="130" y="340" font-size="28" font-weight="700" fill="#9a3412">409 Conflict</text>
    <text x="420" y="340" font-size="23" fill="#374151">변경하려는 email이 다른 회원과 중복</text>
    <rect x="90" y="430" width="1020" height="95" rx="18" fill="#fefce8" stroke="#eab308" stroke-width="3"/>
    <text x="130" y="470" font-size="28" font-weight="700" fill="#854d0e">422 Validation Error</text>
    <text x="420" y="470" font-size="23" fill="#374151">필수값 누락 / 타입·형식 오류 / 잘못된 Request Body</text>
  </g>
</svg>