<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111827">PUT vs PATCH</text>
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="22" fill="#4b5563">전체 수정과 부분 수정의 차이</text>
  <rect x="70" y="190" width="480" height="360" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
  <text x="110" y="245" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3730a3">PUT /members/1</text>
  <text x="110" y="300" font-family="Arial, sans-serif" font-size="23" fill="#111827">전체 상태를 교체</text>
  <text x="110" y="355" font-family="monospace" font-size="20" fill="#374151">name: "Kim Updated"</text>
  <text x="110" y="395" font-family="monospace" font-size="20" fill="#374151">email: "kim2@example.com"</text>
  <text x="110" y="435" font-family="monospace" font-size="20" fill="#374151">age: 31</text>
  <text x="110" y="500" font-family="Arial, sans-serif" font-size="21" fill="#4b5563">필수 필드를 빠뜨리면 계약 위반</text>
  <rect x="650" y="190" width="480" height="360" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="690" y="245" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#047857">PATCH /members/1</text>
  <text x="690" y="300" font-family="Arial, sans-serif" font-size="23" fill="#111827">보낸 필드만 부분 수정</text>
  <text x="690" y="365" font-family="monospace" font-size="20" fill="#374151">email: "new@example.com"</text>
  <text x="690" y="500" font-family="Arial, sans-serif" font-size="21" fill="#4b5563">나머지 필드는 기존 값 유지</text>
</svg>