<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Contract to Tasks</text><g font-family="Arial,sans-serif" font-size="22" text-anchor="middle"><rect x="70" y="170" width="200" height="110" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="170" y="215">Requirement</text><text x="170" y="248">+ DoD</text><rect x="340" y="170" width="200" height="110" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="440" y="215">API</text><text x="440" y="248">Contract</text><rect x="610" y="170" width="200" height="110" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="710" y="215">Task</text><text x="710" y="248">Breakdown</text><rect x="880" y="170" width="240" height="110" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="1000" y="215">AI-assisted</text><text x="1000" y="248">Implementation</text><path d="M270 225 H340" stroke="#374151" stroke-width="4" marker-end="url(#a)"/><path d="M540 225 H610" stroke="#374151" stroke-width="4" marker-end="url(#a)"/><path d="M810 225 H880" stroke="#374151" stroke-width="4" marker-end="url(#a)"/></g><text x="600" y="385" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#374151">One endpoint at a time: GET → POST → PUT/PATCH → DELETE</text><text x="600" y="440" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#6b7280">Do not ask AI for “all CRUD” before the contract is fixed.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs></svg>