<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Backend Project Submission Gate</text><g font-family="Arial,sans-serif" font-size="22" text-anchor="middle"><rect x="85" y="170" width="190" height="105" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="180" y="212">Contract</text><text x="180" y="244">Complete</text><rect x="335" y="170" width="190" height="105" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="430" y="212">CRUD</text><text x="430" y="244">Verified</text><rect x="585" y="170" width="190" height="105" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="680" y="212">Tests</text><text x="680" y="244">Pass</text><rect x="835" y="170" width="280" height="105" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="975" y="212">Evidence + README</text><text x="975" y="244">+ GitHub URL</text><path d="M275 222 H335" stroke="#374151" stroke-width="4" marker-end="url(#a)"/><path d="M525 222 H585" stroke="#374151" stroke-width="4" marker-end="url(#a)"/><path d="M775 222 H835" stroke="#374151" stroke-width="4" marker-end="url(#a)"/></g><text x="600" y="385" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" fill="#374151">Submission = reproducible evidence, not “it worked once”</text><text x="600" y="440" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#6b7280">No secrets · clean Git history · clear run instructions · explainable architecture</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs></svg>