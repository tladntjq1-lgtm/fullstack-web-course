<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">SQL CRUD와 ORM CRUD 대응</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#0f172a">
    <text x="120" y="145" font-weight="700">SQL</text><text x="690" y="145" font-weight="700">SQLAlchemy ORM</text>
    <rect x="80" y="175" width="430" height="95" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="110" y="232">INSERT INTO members ...</text>
    <rect x="650" y="175" width="470" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="680" y="215">member = Member(...)</text><text x="680" y="250">session.add(member)</text>
    <rect x="80" y="300" width="430" height="95" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="110" y="357">SELECT ... WHERE member_id = ?</text>
    <rect x="650" y="300" width="470" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="680" y="357">session.get(Member, member_id)</text>
    <rect x="80" y="425" width="430" height="95" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="110" y="482">UPDATE members SET ...</text>
    <rect x="650" y="425" width="470" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="680" y="465">member.name = ...</text><text x="680" y="500">session.commit()</text>
    <rect x="80" y="550" width="430" height="95" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="110" y="607">DELETE FROM members ...</text>
    <rect x="650" y="550" width="470" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="680" y="590">session.delete(member)</text><text x="680" y="625">session.commit()</text>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M510 222 H650"/><path d="M510 347 H650"/><path d="M510 472 H650"/><path d="M510 597 H650"/></g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text x="80" y="710" font-family="Arial, sans-serif" font-size="23" fill="#334155">표현은 달라도 DB에서 일어나는 CRUD 의미는 같습니다.</text>
</svg>