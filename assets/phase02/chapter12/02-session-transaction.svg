<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Session과 Transaction 경계</text>
  <g font-family="Arial, sans-serif" font-size="23" fill="#0f172a" text-anchor="middle">
    <rect x="90" y="180" rx="18" width="190" height="95" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="185" y="238">session.add()</text>
    <rect x="350" y="180" rx="18" width="190" height="95" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="445" y="238">flush()</text>
    <rect x="610" y="180" rx="18" width="190" height="95" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="705" y="238">commit()</text>
    <rect x="870" y="180" rx="18" width="190" height="95" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="965" y="238">refresh()</text>
    <rect x="350" y="420" rx="18" width="190" height="95" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="445" y="478">오류 발생</text>
    <rect x="610" y="420" rx="18" width="190" height="95" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="705" y="478">rollback()</text>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M280 228 H350"/><path d="M540 228 H610"/><path d="M800 228 H870"/><path d="M445 275 V420"/><path d="M540 468 H610"/></g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="90" y="610" font-family="Arial, sans-serif" font-size="24" fill="#334155">정상은 commit, 실패는 rollback. Session은 단순 연결 객체가 아니라 작업 단위를 관리합니다.</text>
</svg>