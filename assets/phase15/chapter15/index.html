<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Book Explorer</h1>

    <section aria-labelledby="search-heading">
      <h2 id="search-heading">도서 검색</h2>

      <form id="search-form">
        <label for="search-input">검색어</label>
        <input
          id="search-input"
          name="keyword"
          type="search"
          required
        >
        <button type="submit">검색</button>
      </form>

      <p id="status-message" aria-live="polite">검색어를 입력하세요.</p>
      <ul id="book-list"></ul>
    </section>

    <section aria-labelledby="detail-heading">
      <h2 id="detail-heading">도서 상세</h2>
      <div id="book-detail">도서를 선택하세요.</div>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">도서 등록 요청</h2>

      <form id="book-form">
        <label for="title-input">제목</label>
        <input id="title-input" name="title" type="text" required>

        <label for="author-input">저자</label>
        <input id="author-input" name="author" type="text" required>

        <button type="submit">등록 요청</button>
      </form>

      <p id="form-message" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
