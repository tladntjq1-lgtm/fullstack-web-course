<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 09 - 함수, 배열, 객체 실습</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>회원 데이터 관리 실습</h1>
        
        <!-- 👇 입력창 2개와 확인 버튼 -->
        <div class="input-group">
            <input type="text" id="ageInput" placeholder="나이를 입력하세요">
            <input type="text" id="nameInput" placeholder="이름을 입력하세요">
            <button id="greetBtn">확인</button>
        </div>
        
        <!-- 함수 실습 영역 -->
        <div id="greeting-box"></div>
        
        <!-- map() 실습 영역 -->
        <h2>전체 회원 목록 (map)</h2>
        <ul id="user-list"></ul>

        <!-- filter() 실습 영역 -->
        <h2>활동 중인 회원 (filter)</h2>
        <ul id="active-user-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
